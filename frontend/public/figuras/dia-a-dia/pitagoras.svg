<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300" width="360" height="300" role="img" aria-label="Um triângulo com um canto reto. Os dois lados que formam o canto medem 3 e 4. Sobre cada lado há um quadrado desenhado: o do lado 3 tem 9 quadradinhos e o do lado 4 tem 16. Sobre o lado maior, que mede 5, o quadrado tem 25 quadradinhos, que é 9 mais 16."><title>Teorema de Pitágoras: 9 + 16 = 25</title>
<g transform="translate(110 110)">
<path d="M 0 60 L 80 60 L 0 0 Z" fill="#F3E6B3" stroke="#1C1C2E" stroke-width="2.5" stroke-linejoin="round"/>
<rect x="-60" y="0" width="60" height="60" fill="#DCEBF7" stroke="#2F6FB0" stroke-width="2"/>
<rect x="0" y="60" width="80" height="80" fill="#E3EFE0" stroke="#4E8A5B" stroke-width="2"/>
<path d="M 0 0 L 80 60 L 140 -20 L 60 -80 Z" fill="#F9DED5" stroke="#C8553D" stroke-width="2"/>
<path d="M 0 0 L 80 60 L 0 60 Z" fill="#F3E6B3" stroke="#1C1C2E" stroke-width="2.5" stroke-linejoin="round"/>
<rect x="0" y="48" width="12" height="12" fill="none" stroke="#1C1C2E" stroke-width="1.6"/>
</g>
<text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="15" font-weight="700" text-anchor="middle"><tspan x="80" y="145" fill="#2F6FB0">9</tspan><tspan x="150" y="215" fill="#4E8A5B">16</tspan><tspan x="182" y="102" fill="#C8553D">25</tspan></text>
<text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="600" fill="#1C1C2E" text-anchor="middle"><tspan x="119" y="154">3</tspan><tspan x="160" y="166">4</tspan><tspan x="152" y="148">5</tspan></text>
<text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="14" font-weight="700" fill="#1C1C2E" text-anchor="middle"><tspan x="180" y="285">3² + 4² = 5²  →  9 + 16 = 25</tspan></text>
</svg>
