<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" width="400" height="220" role="img" aria-label="Um círculo com o centro marcado. Uma linha vai do centro até a borda: é o raio, r. Outra linha atravessa o círculo inteiro passando pelo centro: é o diâmetro, que vale dois raios. A linha da borda é a circunferência, cujo comprimento é 2 vezes pi vezes r. A parte de dentro tem área pi vezes r ao quadrado."><title>Raio, diâmetro, circunferência e área do círculo</title>
<circle cx="120" cy="110" r="85" fill="#DCEBF7" stroke="#1C1C2E" stroke-width="2.5"/>
<path d="M 35 110 L 205 110" stroke="#C8553D" stroke-width="2.2"/>
<path d="M 120 110 L 180 50" stroke="#2F6FB0" stroke-width="2.2"/>
<circle cx="120" cy="110" r="3.5" fill="#1C1C2E"/>
<text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" font-weight="700" fill="#2F6FB0"><tspan x="152" y="74">r</tspan></text>
<text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="600" fill="#C8553D" text-anchor="middle"><tspan x="120" y="128">diâmetro = 2r</tspan></text>
<text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="14" font-weight="700" fill="#1C1C2E"><tspan x="240" y="60">raio: r</tspan><tspan x="240" y="92">diâmetro: 2 × r</tspan><tspan x="240" y="124">contorno: 2 × π × r</tspan><tspan x="240" y="156">área: π × r²</tspan></text>
<text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" fill="#1C1C2E" fill-opacity="0.75"><tspan x="240" y="186">π ≈ 3,14</tspan></text>
</svg>
