<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 210" width="440" height="210" role="img" aria-label="Três figuras com a conta da área embaixo de cada uma. Um retângulo de base b e altura h: área igual a b vezes h. Um triângulo com a mesma base e a mesma altura, desenhado dentro de um retângulo tracejado: a área é a metade, b vezes h dividido por 2. Um trapézio com base maior B, base menor b e altura h: área igual a B mais b, vezes h, dividido por 2."><title>Área do retângulo, do triângulo e do trapézio</title>
<rect x="20" y="40" width="110" height="80" fill="#DCEBF7" stroke="#1C1C2E" stroke-width="2.5"/>
<rect x="160" y="40" width="110" height="80" fill="none" stroke="#1C1C2E" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="5 4"/>
<path d="M 160 120 L 270 120 L 215 40 Z" fill="#E3EFE0" stroke="#1C1C2E" stroke-width="2.5" stroke-linejoin="round"/>
<path d="M 215 40 L 215 120" stroke="#4E8A5B" stroke-width="1.6" stroke-dasharray="4 3"/>
<path d="M 300 120 L 420 120 L 390 40 L 330 40 Z" fill="#F3E6B3" stroke="#1C1C2E" stroke-width="2.5" stroke-linejoin="round"/>
<path d="M 330 40 L 330 120" stroke="#1C1C2E" stroke-width="1.4" stroke-dasharray="4 3"/>
<text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" font-weight="600" fill="#1C1C2E" text-anchor="middle"><tspan x="75" y="136">b</tspan><tspan x="215" y="136">b</tspan><tspan x="360" y="136">B</tspan><tspan x="360" y="34">b</tspan></text>
<text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" font-weight="600" fill="#1C1C2E"><tspan x="134" y="85">h</tspan><tspan x="220" y="88">h</tspan><tspan x="316" y="85">h</tspan></text>
<text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="14" font-weight="700" fill="#1C1C2E" text-anchor="middle"><tspan x="75" y="168">retângulo</tspan><tspan x="215" y="168">triângulo</tspan><tspan x="360" y="168">trapézio</tspan></text>
<text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" fill="#2F6FB0" font-weight="600" text-anchor="middle"><tspan x="75" y="190">b × h</tspan><tspan x="215" y="190">b × h ÷ 2</tspan><tspan x="360" y="190">(B + b) × h ÷ 2</tspan></text>
</svg>
