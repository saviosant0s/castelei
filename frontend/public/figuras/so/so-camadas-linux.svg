<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 300" width="440" height="300" role="img" aria-label="As camadas de um sistema Linux, dos programas até as peças, com uma coluna ao lado mostrando o que o Android acrescenta"><title>As camadas de um sistema Linux, dos programas até as peças, com uma coluna ao lado mostrando o que o Android acrescenta</title><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="600" fill="#1C1C2E" text-anchor="middle"><tspan x="150" y="24">Linux</tspan></text><rect x="14" y="36" width="272" height="44" rx="7" fill="#DCEBFA" stroke="#1C1C2E" stroke-width="1.5"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="10.5" font-weight="400" fill="#1C1C2E" text-anchor="middle" dominant-baseline="central"><tspan x="150" y="58">programas: navegador, terminal, editor</tspan></text><rect x="14" y="84" width="272" height="44" rx="7" fill="#DCEBFA" stroke="#1C1C2E" stroke-width="1.5"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="10.5" font-weight="400" fill="#1C1C2E" text-anchor="middle" dominant-baseline="central"><tspan x="150" y="106">pacotes de código prontos</tspan></text><rect x="14" y="132" width="272" height="44" rx="7" fill="#F3F3F6" stroke="#1C1C2E" stroke-width="1.5"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="10.5" font-weight="400" fill="#1C1C2E" text-anchor="middle" dominant-baseline="central"><tspan x="150" y="154">a fronteira: os pedidos ao núcleo</tspan></text><rect x="14" y="180" width="272" height="48" rx="7" fill="#DDF3E7" stroke="#1C1C2E" stroke-width="1.5"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="10.5" font-weight="400" fill="#1C1C2E" text-anchor="middle" dominant-baseline="central"><tspan x="150" y="204">núcleo Linux, com partes que entram e saem</tspan></text><rect x="14" y="240" width="272" height="44" rx="7" fill="#FDE7DF" stroke="#1C1C2E" stroke-width="1.5"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="10.5" font-weight="400" fill="#1C1C2E" text-anchor="middle" dominant-baseline="central"><tspan x="150" y="262">as peças do computador</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="600" fill="#1C1C2E" text-anchor="middle"><tspan x="363" y="24">No Android</tspan></text><rect x="300" y="36" width="126" height="92" rx="7" fill="#DCEBFA" stroke="#1C1C2E" stroke-width="1.5"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="10.5" font-weight="400" fill="#1C1C2E" text-anchor="middle" dominant-baseline="central"><tspan x="363" y="67">aplicativos, no</tspan><tspan x="363" y="82">formato próprio</tspan><tspan x="363" y="97">do Android</tspan></text><rect x="300" y="132" width="126" height="92" rx="7" fill="#DDF3E7" stroke="#1C1C2E" stroke-width="1.5"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="10" font-weight="400" fill="#1C1C2E" text-anchor="middle" dominant-baseline="central"><tspan x="363" y="148">máquina que roda</tspan><tspan x="363" y="163">o aplicativo, mais</tspan><tspan x="363" y="178">o jeito próprio de</tspan><tspan x="363" y="193">os programas</tspan><tspan x="363" y="208">conversarem</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="10.5" fill="#1C1C2E" text-anchor="middle"><tspan x="363" y="246">em cima do</tspan><tspan x="363" y="260">mesmo núcleo</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="10.5" fill="#1C1C2E" text-anchor="middle"><tspan x="220" y="292">o núcleo é o mesmo; muda tudo o que fica acima dele</tspan></text></svg>