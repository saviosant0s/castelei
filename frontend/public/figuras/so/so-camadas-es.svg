<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 300" width="440" height="300" role="img" aria-label="Cinco camadas empilhadas entre o programa e a peça do computador, com o pedido descendo pela esquerda e a resposta subindo pela direita"><title>Cinco camadas empilhadas entre o programa e a peça do computador, com o pedido descendo pela esquerda e a resposta subindo pela direita</title><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1C1C2E"/></marker></defs><rect x="60" y="16" width="320" height="44" rx="8" fill="#DCEBFA" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" fill="#1C1C2E" text-anchor="middle" dominant-baseline="central"><tspan x="220" y="38">Programa da pessoa</tspan></text><rect x="60" y="70" width="320" height="44" rx="8" fill="#DCEBFA" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" fill="#1C1C2E" text-anchor="middle" dominant-baseline="central"><tspan x="220" y="92">Parte do sistema igual para todas as peças</tspan></text><rect x="60" y="124" width="320" height="44" rx="8" fill="#DDF3E7" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" fill="#1C1C2E" text-anchor="middle" dominant-baseline="central"><tspan x="220" y="146">Driver: o tradutor daquele modelo</tspan></text><rect x="60" y="178" width="320" height="44" rx="8" fill="#DDF3E7" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" fill="#1C1C2E" text-anchor="middle" dominant-baseline="central"><tspan x="220" y="200">Quem atende o aviso da peça</tspan></text><rect x="60" y="232" width="320" height="44" rx="8" fill="#FDE7DF" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" fill="#1C1C2E" text-anchor="middle" dominant-baseline="central"><tspan x="220" y="254">A peça e o controlador dela</tspan></text><line x1="36" y1="22" x2="36" y2="262" stroke="#1C1C2E" stroke-width="1.6" marker-end="url(#a)"/><line x1="404" y1="262" x2="404" y2="22" stroke="#1C1C2E" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#a)"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" fill="#1C1C2E" text-anchor="middle"><tspan x="20" y="145">pedido</tspan><tspan x="422" y="145">resposta</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="10.5" fill="#1C1C2E" text-anchor="middle"><tspan x="220" y="292">cada camada só conversa com a de cima e a de baixo</tspan></text></svg>