<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 312" width="300" height="312" role="img" aria-label="Uma mesa redonda com cinco pessoas sentadas em volta e cinco garfos, um entre cada par de vizinhos"><title>Uma mesa redonda com cinco pessoas sentadas em volta e cinco garfos, um entre cada par de vizinhos</title><circle cx="150" cy="150" r="72" fill="#FDE7DF" stroke="#1C1C2E" stroke-width="1.8"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" fill="#1C1C2E" text-anchor="middle"><tspan x="150" y="154">a mesa</tspan></text><circle cx="150" cy="38" r="24" fill="#DCEBFA" stroke="#1C1C2E" stroke-width="1.6"/><circle cx="256" cy="115" r="24" fill="#DCEBFA" stroke="#1C1C2E" stroke-width="1.6"/><circle cx="216" cy="241" r="24" fill="#DCEBFA" stroke="#1C1C2E" stroke-width="1.6"/><circle cx="84" cy="241" r="24" fill="#DCEBFA" stroke="#1C1C2E" stroke-width="1.6"/><circle cx="44" cy="115" r="24" fill="#DCEBFA" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12.5" fill="#1C1C2E" text-anchor="middle" dominant-baseline="central"><tspan x="150" y="38">P1</tspan><tspan x="256" y="115">P2</tspan><tspan x="216" y="241">P3</tspan><tspan x="84" y="241">P4</tspan><tspan x="44" y="115">P5</tspan></text><circle cx="201" cy="80" r="9" fill="#FFFFFF" stroke="#1C1C2E" stroke-width="1.5"/><circle cx="232" cy="177" r="9" fill="#FFFFFF" stroke="#1C1C2E" stroke-width="1.5"/><circle cx="150" cy="236" r="9" fill="#FFFFFF" stroke="#1C1C2E" stroke-width="1.5"/><circle cx="68" cy="177" r="9" fill="#FFFFFF" stroke="#1C1C2E" stroke-width="1.5"/><circle cx="99" cy="80" r="9" fill="#FFFFFF" stroke="#1C1C2E" stroke-width="1.5"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" fill="#1C1C2E" text-anchor="middle"><tspan x="150" y="292">os círculos pequenos são os garfos: há um entre cada dupla</tspan><tspan x="150" y="306">e cada pessoa precisa dos dois vizinhos ao seu lado</tspan></text></svg>
