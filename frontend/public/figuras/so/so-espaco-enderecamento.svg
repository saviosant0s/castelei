<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 286" width="400" height="286" role="img" aria-label="Cada processo tem seu espaço de endereçamento de zero até um máximo; o sistema o leva para a memória principal e, se preciso, para o disco"><title>Cada processo tem seu espaço de endereçamento de zero até um máximo; o sistema o leva para a memória principal e, se preciso, para o disco</title><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1C1C2E"/></marker><marker id="c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#F4845F"/></marker></defs><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="700" fill="#1C1C2E" text-anchor="middle" dominant-baseline="central"><tspan x="52" y="20.0">Processo A</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="700" fill="#1C1C2E" text-anchor="middle" dominant-baseline="central"><tspan x="348" y="20.0">Processo B</tspan></text><rect x="12" y="34" width="80" height="190" rx="8" fill="#DCEBFA" stroke="#1C1C2E" stroke-width="1.6"/><rect x="308" y="34" width="80" height="190" rx="8" fill="#DDF3E7" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="700" fill="#1C1C2E" text-anchor="middle" dominant-baseline="central"><tspan x="52" y="48.0">0</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="700" fill="#1C1C2E" text-anchor="middle" dominant-baseline="central"><tspan x="52" y="210.0">máx.</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="700" fill="#1C1C2E" text-anchor="middle" dominant-baseline="central"><tspan x="348" y="48.0">0</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="700" fill="#1C1C2E" text-anchor="middle" dominant-baseline="central"><tspan x="348" y="210.0">máx.</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="400" fill="#1C1C2E" text-anchor="middle" dominant-baseline="central"><tspan x="52" y="112.4">cada um</tspan><tspan x="52" y="128.0">enxerga só</tspan><tspan x="52" y="143.6">o seu espaço</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="400" fill="#1C1C2E" text-anchor="middle" dominant-baseline="central"><tspan x="348" y="112.4">endereços</tspan><tspan x="348" y="128.0">de 0 até</tspan><tspan x="348" y="143.6">o máximo</tspan></text><rect x="128" y="34" width="144" height="124" rx="10" fill="#FFFFFF" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12.5" font-weight="700" fill="#1C1C2E" text-anchor="middle" dominant-baseline="central"><tspan x="200" y="41.9">Memória principal</tspan><tspan x="200" y="58.1">(RAM)</tspan></text><rect x="142" y="86" width="48" height="60" rx="4" fill="#DCEBFA" stroke="#1C1C2E"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" font-weight="700" fill="#1C1C2E" text-anchor="middle" dominant-baseline="central"><tspan x="166" y="116.0">A</tspan></text><rect x="210" y="86" width="48" height="60" rx="4" fill="#DDF3E7" stroke="#1C1C2E"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" font-weight="700" fill="#1C1C2E" text-anchor="middle" dominant-baseline="central"><tspan x="234" y="116.0">B</tspan></text><line x1="92" y1="116" x2="140" y2="116" stroke="#1C1C2E" stroke-width="1.4" marker-end="url(#a)"/><line x1="308" y1="116" x2="260" y2="116" stroke="#1C1C2E" stroke-width="1.4" marker-end="url(#a)"/><rect x="128" y="182" width="144" height="48" rx="10" fill="#FDE7DF" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11.5" font-weight="400" fill="#1C1C2E" text-anchor="middle" dominant-baseline="central"><tspan x="200.0" y="198.5">Disco: guarda o que</tspan><tspan x="200.0" y="213.5">não cabe na RAM</tspan></text><line x1="308" y1="205" x2="274" y2="205" stroke="#F4845F" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#c)"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="400" fill="#1C1C2E" text-anchor="middle" dominant-baseline="central"><tspan x="200" y="254.2">Cada espaço é levado para a RAM. Se faltar lugar,</tspan><tspan x="200" y="269.8">o sistema usa o disco (é a memória virtual).</tspan></text></svg>