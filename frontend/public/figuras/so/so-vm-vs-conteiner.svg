span x="112" y="180">as peças do computador</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="600" fill="#1C1C2E" text-anchor="middle"><tspan x="328" y="24">Contêineres</tspan></text><rect x="230" y="60" width="62" height="54" rx="7" fill="#DCEBFA" stroke="#1C1C2E" stroke-width="1.5"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="10.5" font-weight="400" fill="#1C1C2E" text-anchor="middle" dominant-baseline="central"><tspan x="261" y="87">programa</tspan></text><rect x="298" y="60" width="62" height="54" rx="7" fill="#DCEBFA" stroke="#1C1C2E" stroke-width="1.5"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="10.5" font-weight="400" fill="#1C1C2E" text-anchor="middle" dominant-baseline="central"><tspan x="329" y="87">programa</tspan></text><rect x="366" y="60" width="60" height="54" rx="7" fill="#DCEBFA" stroke="#1C1C2E" stroke-width="1.5"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="10.5" font-weight="400" fill="#1C1C2E" text-anchor="middle" dominant-baseline="central"><tspan x="396" y="87">programa</tspan></text><rect x="230" y="122" width="196" height="34" rx="7" fill="#DDF3E7" stroke="#1C1C2E" stroke-width="1.5"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" font-weight="400" fill="#1C1C2E" text-anchor="middle" dominant-baseline="central"><tspan x="328" y="139">um núcleo de sistema só, para todos</tspan></text><rect x="230" y="164" width="196" height="32" rx="7" fill="#FDE7DF" stroke="#1C1C2E" stroke-width="1.5"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" font-weight="400" fill="#1C1C2E" text-anchor="middle" dominant-baseline="central"><tspan x="328" y="180">as peças do computador</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="10.5" fill="#1C1C2E" text-anchor="middle"><tspan x="112" y="222">cada caixa carrega um sistema</tspan><tspan x="112" y="237">inteiro: pesa e demora a subir</tspan><tspan x="328" y="222">as caixas dividem o mesmo núcleo:</tspan><tspan x="328" y="237">sobem em menos de um segundo</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="10.5" fill="#1C1C2E" text-anchor="middle"><tspan x="220" y="272">dividir o núcleo é o que deixa leve, e também o que isola menos</tspan></text></svg>