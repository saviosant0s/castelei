<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 278" width="400" height="278" role="img" aria-label="A memória dividida em quatro faixas: a de baixo guarda o sistema operacional e as três de cima guardam um trabalho cada. Enquanto o trabalho do meio espera a fita, a máquina passa a trabalhar no de cima."><title>A memória dividida em quatro faixas: a de baixo guarda o sistema operacional e as três de cima guardam um trabalho cada. Enquanto o trabalho do meio espera a fita, a máquina passa a trabalhar no de cima.</title><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" font-weight="600" fill="#1C1C2E" fill-opacity="0.65" letter-spacing="1.2"><tspan x="20" y="24">MEMÓRIA</tspan></text><rect x="20" y="40" width="196" height="48" rx="8" fill="#DDF3E7" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" font-weight="600" fill="#1C1C2E" text-anchor="middle"><tspan x="118.0" y="58.0">Trabalho 3</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" fill="#1C1C2E" fill-opacity="0.75" text-anchor="middle"><tspan x="118.0" y="76.0">calculando</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11.5" font-weight="600" fill="#F4845F"><tspan x="254" y="68">usando o processador</tspan></text><rect x="20" y="100" width="196" height="48" rx="8" fill="#FDE7DF" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" font-weight="600" fill="#1C1C2E" text-anchor="middle"><tspan x="118.0" y="118.0">Trabalho 2</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" fill="#1C1C2E" fill-opacity="0.75" text-anchor="middle"><tspan x="118.0" y="136.0">parado na fita</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11.5" font-weight="400" fill="#1C1C2E"><tspan x="254" y="128">espera a leitura acabar</tspan></text><rect x="20" y="160" width="196" height="48" rx="8" fill="#FFFFFF" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" font-weight="600" fill="#1C1C2E" text-anchor="middle"><tspan x="118.0" y="178.0">Trabalho 1</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" fill="#1C1C2E" fill-opacity="0.75" text-anchor="middle"><tspan x="118.0" y="196.0">na fila</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11.5" font-weight="400" fill="#1C1C2E"><tspan x="254" y="188">pronto para a vez dele</tspan></text><rect x="20" y="220" width="196" height="44" rx="8" fill="#DCEBFA" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" font-weight="600" fill="#1C1C2E" text-anchor="middle"><tspan x="118.0" y="246.0">Sistema operacional</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11.5" font-weight="400" fill="#1C1C2E"><tspan x="254" y="248">decide de quem é a vez</tspan></text><path d="M 222 124 C 244 124 244 64 222 64" fill="none" stroke="#F4845F" stroke-width="2" stroke-dasharray="4 3"/></svg>