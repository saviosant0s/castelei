<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 306" width="400" height="306" role="img" aria-label="Quatro peças do computador comparadas a uma cozinha: processador é o cozinheiro, memória RAM é a bancada, disco é a despensa e entrada e saída são as portas. O sistema operacional é o gerente de tudo isso"><title>Quatro peças do computador comparadas a uma cozinha: processador é o cozinheiro, memória RAM é a bancada, disco é a despensa e entrada e saída são as portas. O sistema operacional é o gerente de tudo isso</title><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1C1C2E"/></marker><marker id="c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#F4845F"/></marker></defs><rect x="14" y="16" width="172" height="92" rx="10" fill="#DCEBFA" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12.5" font-weight="400" fill="#1C1C2E" text-anchor="middle" dominant-baseline="central"><tspan x="100.0" y="45.8">Processador</tspan><tspan x="100.0" y="62.0">o cozinheiro</tspan><tspan x="100.0" y="78.2">executa as instruções</tspan></text><rect x="214" y="16" width="172" height="92" rx="10" fill="#DDF3E7" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12.5" font-weight="400" fill="#1C1C2E" text-anchor="middle" dominant-baseline="central"><tspan x="300.0" y="45.8">Memória RAM</tspan><tspan x="300.0" y="62.0">a bancada</tspan><tspan x="300.0" y="78.2">o que está em uso agora</tspan></text><rect x="14" y="132" width="172" height="92" rx="10" fill="#FDE7DF" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12.5" font-weight="400" fill="#1C1C2E" text-anchor="middle" dominant-baseline="central"><tspan x="100.0" y="161.8">Disco (SSD ou HD)</tspan><tspan x="100.0" y="178.0">a despensa</tspan><tspan x="100.0" y="194.2">guarda os arquivos</tspan></text><rect x="214" y="132" width="172" height="92" rx="10" fill="#EEF1F5" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12.5" font-weight="400" fill="#1C1C2E" text-anchor="middle" dominant-baseline="central"><tspan x="300.0" y="161.8">Entrada e saída</tspan><tspan x="300.0" y="178.0">as portas da cozinha</tspan><tspan x="300.0" y="194.2">teclado, tela, rede</tspan></text><rect x="14" y="246" width="372" height="46" rx="10" fill="#FFFFFF" stroke="#1C1C2E" stroke-width="1.6" stroke-dasharray="6 4"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12.5" font-weight="700" fill="#1C1C2E" text-anchor="middle" dominant-baseline="central"><tspan x="200" y="269.0">O sistema operacional é o gerente que organiza tudo isso</tspan></text></svg>