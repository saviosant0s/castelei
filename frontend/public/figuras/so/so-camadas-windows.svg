<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 300" width="440" height="300" role="img" aria-label="As camadas do Windows, dos programas até as peças, com a linha que separa o lado de pouco poder do lado de muito poder"><title>As camadas do Windows, dos programas até as peças, com a linha que separa o lado de pouco poder do lado de muito poder</title><rect x="60" y="30" width="320" height="40" rx="7" fill="#DCEBFA" stroke="#1C1C2E" stroke-width="1.5"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" font-weight="400" fill="#1C1C2E" text-anchor="middle" dominant-baseline="central"><tspan x="220" y="50">programas comuns</tspan></text><rect x="60" y="78" width="320" height="40" rx="7" fill="#DCEBFA" stroke="#1C1C2E" stroke-width="1.5"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" font-weight="400" fill="#1C1C2E" text-anchor="middle" dominant-baseline="central"><tspan x="220" y="98">pacotes de código que o Windows oferece</tspan></text><line x1="40" y1="132" x2="400" y2="132" stroke="#1C1C2E" stroke-width="1.6" stroke-dasharray="6 4"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="10" font-style="italic" fill="#1C1C2E" text-anchor="start"><tspan x="44" y="128">pouco poder</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="10" font-style="italic" fill="#1C1C2E" text-anchor="start"><tspan x="44" y="146">muito poder</tspan></text><rect x="60" y="152" width="320" height="52" rx="7" fill="#DDF3E7" stroke="#1C1C2E" stroke-width="1.5"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" font-weight="400" fill="#1C1C2E" text-anchor="middle" dominant-baseline="central"><tspan x="220" y="170">a parte grande do sistema: processos,</tspan><tspan x="220" y="186">memória, arquivos e peças</tspan></text><rect x="60" y="212" width="320" height="44" rx="7" fill="#F3F3F6" stroke="#1C1C2E" 