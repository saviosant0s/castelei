<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 232" width="440" height="232" role="img" aria-label="Três arranjos de discos lado a lado: os dados divididos entre discos, os dados copiados em dois discos, e dois discos de dados mais um de conferência"><title>Três arranjos de discos lado a lado: os dados divididos entre discos, os dados copiados em dois discos, e dois discos de dados mais um de conferência</title><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="600" fill="#1C1C2E" text-anchor="middle"><tspan x="77" y="24">Dividido</tspan></text><rect x="14" y="40" width="38" height="78" rx="6" fill="#DCEBFA" stroke="#1C1C2E" stroke-width="1.5"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" fill="#1C1C2E" text-anchor="middle" dominant-baseline="central"><tspan x="33" y="79">A1</tspan></text><rect x="58" y="40" width="38" height="78" rx="6" fill="#DCEBFA" stroke="#1C1C2E" stroke-width="1.5"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" fill="#1C1C2E" text-anchor="middle" dominant-baseline="central"><tspan x="77" y="79">A2</tspan></text><rect x="102" y="40" width="38" height="78" rx="6" fill="#DCEBFA" stroke="#1C1C2E" stroke-width="1.5"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" fill="#1C1C2E" text-anchor="middle" dominant-baseline="central"><tspan x="121" y="79">A3</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="10.5" fill="#1C1C2E" text-anchor="middle"><tspan x="77" y="144">rápido, e um só disco</tspan><tspan x="77" y="159">que quebre derruba tudo</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="600" fill="#1C1C2E" text-anchor="middle"><tspan x="223" y="24">Copiado</tspan></text><rect x="160" y="40" width="38" height="78" rx="6" fill="#DDF3E7" stroke="#1C1C2E" stroke-width="1.5"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" fill="#1C1C2E" text-anchor="middle" dominant-baseline="central"><tspan x="179" y="79">A1</tspan></text><rect x="204" y="40" width="38" height="78" rx="6" fill="#DDF3E7" stroke="#1C1C2E" stroke-width="1.5"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" fill="#1C1C2E" text-anchor="middle" dominant-baseline="central"><tspan x="223" y="79">A1</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="10.5" fill="#1C1C2E" text-anchor="middle"><tspan x="223" y="144">aguenta perder um disco,</tspan><tspan x="223" y="159">e custa metade do espaço</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="600" fill="#1C1C2E" text-anchor="middle"><tspan x="363" y="24">Com conferência</tspan></text><rect x="300" y="40" width="38" height="78" rx="6" fill="#FDE7DF" stroke="#1C1C2E" stroke-width="1.5"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" fill="#1C1C2E" text-anchor="middle" dominant-baseline="central"><tspan x="319" y="79">A1</tspan></text><rect x="344" y="40" width="38" height="78" rx="6" fill="#FDE7DF" stroke="#1C1C2E" stroke-width="1.5"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" fill="#1C1C2E" text-anchor="middle" dominant-baseline="central"><tspan x="363" y="79">A2</tspan></text><rect x="388" y="40" width="38" height="78" rx="6" fill="#FDE7DF" stroke="#1C1C2E" stroke-width="1.5"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" fill="#1C1C2E" text-anchor="middle" dominant-baseline="central"><tspan x="407" y="79">P</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="10.5" fill="#1C1C2E" text-anchor="middle"><tspan x="363" y="144">aguenta perder um disco,</tspan><tspan x="363" y="159">e gasta um disco só</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="10.5" fill="#1C1C2E" text-anchor="middle"><tspan x="220" y="212">A1, A2 e A3 são pedaços do mesmo arquivo. P é a conferência deles.</tspan></text></svg>