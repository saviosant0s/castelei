<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 314" width="400" height="314" role="img" aria-label="A memória de um processo desenhada como uma coluna. Embaixo fica o texto, com o código do programa; acima dele os dados, que crescem para cima; no topo a pilha, que cresce para baixo; e no meio a lacuna vazia que os dois disputam."><title>A memória de um processo desenhada como uma coluna. Embaixo fica o texto, com o código do programa; acima dele os dados, que crescem para cima; no topo a pilha, que cresce para baixo; e no meio a lacuna vazia que os dois disputam.</title><defs><marker id="s" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#F4845F"/></marker></defs><rect x="96" y="76" width="208" height="120" fill="#FFFFFF" stroke="#1C1C2E" stroke-width="1.6" stroke-dasharray="5 4"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="600" fill="#1C1C2E" fill-opacity="0.55" text-anchor="middle"><tspan x="200.0" y="130">lacuna</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="10.5" font-weight="400" fill="#1C1C2E" fill-opacity="0.55" text-anchor="middle"><tspan x="200.0" y="148">espaço livre entre as duas</tspan></text><rect x="96" y="30" width="208" height="46" fill="#FDE7DF" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" font-weight="700" fill="#1C1C2E" text-anchor="middle"><tspan x="200.0" y="51.0">Pilha</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="10.5" font-weight="400" fill="#1C1C2E" fill-opacity="0.75" text-anchor="middle"><tspan x="200.0" y="67.0">variáveis locais e chamadas</tspan></text><rect x="96" y="196" width="208" height="40" fill="#DDF3E7" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" font-weight="700" fill="#1C1C2E" text-anchor="middle"><tspan x="200.0" y="214.0">Dados</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="10.5" font-weight="400" fill="#1C1C2E" fill-opacity="0.75" text-anchor="middle"><tspan x="200.0" y="230.0">variáveis globais</tspan></text><rect x="96" y="244" width="208" height="40" fill="#DCEBFA" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" font-weight="700" fill="#1C1C2E" text-anchor="middle"><tspan x="200.0" y="262.0">Texto</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="10.5" font-weight="400" fill="#1C1C2E" fill-opacity="0.75" text-anchor="middle"><tspan x="200.0" y="278.0">o código do programa</tspan></text><path d="M 320 82 L 320 112" stroke="#F4845F" stroke-width="2" marker-end="url(#s)"/><path d="M 320 190 L 320 160" stroke="#F4845F" stroke-width="2" marker-end="url(#s)"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="10" font-weight="600" fill="#F4845F" fill-opacity="0.8" text-anchor="end"><tspan x="84" y="100">cresce</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="10" font-weight="600" fill="#F4845F" fill-opacity="0.8" text-anchor="end"><tspan x="84" y="114">para baixo</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="10" font-weight="600" fill="#F4845F" fill-opacity="0.8" text-anchor="end"><tspan x="84" y="172">cresce</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="10" font-weight="600" fill="#F4845F" fill-opacity="0.8" text-anchor="end"><tspan x="84" y="186">para cima</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="10.5" font-weight="600" fill="#1C1C2E" fill-opacity="0.6" text-anchor="middle"><tspan x="200" y="18">endereços 