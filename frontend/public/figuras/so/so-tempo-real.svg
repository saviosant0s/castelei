<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 268" width="400" height="268" role="img" aria-label="Dois grupos lado a lado. À esquerda, o tempo real rígido, com controle de aeronave, marca-passo e airbag, e a frase de que perder o prazo é inaceitável. À direita, o tempo real flexível, com vídeo, chamada de voz e jogo em rede, onde um atraso ocasional é tolerado."><title>Dois grupos lado a lado. À esquerda, o tempo real rígido, com controle de aeronave, marca-passo e airbag, e a frase de que perder o prazo é inaceitável. À direita, o tempo real flexível, com vídeo, chamada de voz e jogo em rede, onde um atraso ocasional é tolerado.</title><rect x="10" y="14" width="182" height="240" rx="12" fill="#FDE7DF" stroke="#F4845F" stroke-width="1.8"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" font-weight="700" fill="#1C1C2E" text-anchor="middle"><tspan x="101" y="42">Tempo real rígido</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="10.5" font-weight="400" fill="#1C1C2E" fill-opacity="0.75" text-anchor="middle"><tspan x="101" y="62">perder o prazo é inaceitável</tspan></text><rect x="26" y="84" width="150" height="38" rx="8" fill="#FFFFFF" stroke="#1C1C2E" stroke-width="1.4"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11.5" font-weight="600" fill="#1C1C2E" text-anchor="middle"><tspan x="101" y="108">Controle de aeronave</tspan></text><rect x="26" y="134" width="150" height="38" rx="8" fill="#FFFFFF" stroke="#1C1C2E" stroke-width="1.4"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11.5" font-weight="600" fill="#1C1C2E" text-anchor="middle"><tspan x="101" y="158">Marca-passo</tspan></text><rect x="26" y="184" width="150" height="38" rx="8" fill="#FFFFFF" stroke="#1C1C2E" stroke-width="1.4"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11.5" font-weight="600" fill="#1C1C2E" text-anchor="middle"><tspan x="101" y="208">Airbag</tspan></text><rect x="208" y="14" width="182" height="240" rx="12" fill="#DCEBFA" stroke="#1C1C2E" stroke-width="1.8"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" font-weight="700" fill="#1C1C2E" text-anchor="middle"><tspan x="299" y="42">Tempo real flexível</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="10.5" font-weight="400" fill="#1C1C2E" fill-opacity="0.75" text-anchor="middle"><tspan x="299" y="62">atraso ocasional é tolerado</tspan></text><rect x="224" y="84" width="150" height="38" rx="8" fill="#FFFFFF" stroke="#1C1C2E" stroke-width="1.4"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11.5" font-weight="600" fill="#1C1C2E" text-anchor="middle"><tspan x="299" y="108">Vídeo sob demanda</tspan></text><rect x="224" y="134" width="150" height="38" rx="8" fill="#FFFFFF" stroke="#1C1C2E" stroke-width="1.4"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11.5" font-weight="600" fill="#1C1C2E" text-anchor="middle"><tspan x="299" y="158">Chamada de voz</tspan></text><rect x="224" y="184" width="150" height="38" rx="8" fill="#FFFFFF" stroke="#1C1C2E" stroke-width="1.4"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11.5" font-weight="600" fill="#1C1C2E" text-anchor="middle"><tspan x="299" y="208">Jogo em rede</tspan></text><line x1="200" y1="30" x2="200" y2="238" stroke="#1C1C2E" stroke-width="1.4" stroke-opacity="0.25" stroke-dasharray="5 4"/></svg>