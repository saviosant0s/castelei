<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 330" width="400" height="330" role="img" aria-label="Dois modos do processador: o modo usuário para programas comuns e o modo núcleo para o sistema operacional; a passagem acontece por uma instrução TRAP"><title>Dois modos do processador: o modo usuário para programas comuns e o modo núcleo para o sistema operacional; a passagem acontece por uma instrução TRAP</title><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1C1C2E"/></marker><marker id="c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#F4845F"/></marker></defs><rect x="30" y="14" width="340" height="100" rx="10" fill="#DCEBFA" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" font-weight="400" fill="#1C1C2E" text-anchor="middle" dominant-baseline="central"><tspan x="200.0" y="47.1">Modo usuário</tspan><tspan x="200.0" y="64.0">programas comuns: navegador, editor, jogo…</tspan><tspan x="200.0" y="80.9">(sem acesso direto ao hardware)</tspan></text><line x1="150" y1="114" x2="150" y2="172" stroke="#1C1C2E" stroke-width="1.6" marker-end="url(#a)"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="400" fill="#1C1C2E" text-anchor="start" dominant-baseline="central"><tspan x="160" y="142.0">pede (TRAP)</tspan></text><line x1="250" y1="172" x2="250" y2="114" stroke="#1C1C2E" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#a)"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="400" fill="#1C1C2E" text-anchor="start" dominant-baseline="central"><tspan x="260" y="142.0">resposta</tspan></text><rect x="30" y="172" width="340" height="74" rx="10" fill="#DDF3E7" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="syste