<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img" aria-label="Diagrama com as três situações de um processo: executando no topo, bloqueado à esquerda e pronto à direita, ligados por quatro setas de mudança"><title>Diagrama com as três situações de um processo: executando no topo, bloqueado à esquerda e pronto à direita, ligados por quatro setas de mudança</title><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1C1C2E"/></marker></defs><rect x="135" y="18" width="130" height="52" rx="10" fill="#DDF3E7" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" fill="#1C1C2E" text-anchor="middle" dominant-baseline="central"><tspan x="200" y="37">Executando</tspan><tspan x="200" y="54" font-size="11">usando o processador</tspan></text><rect x="14" y="212" width="146" height="52" rx="10" fill="#FDE7DF" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" fill="#1C1C2E" text-anchor="middle" dominant-baseline="central"><tspan x="87" y="231">Bloqueado</tspan><tspan x="87" y="248" font-size="11">espera algo de fora</tspan></text><rect x="240" y="212" width="146" height="52" rx="10" fill="#DCEBFA" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" fill="#1C1C2E" text-anchor="middle" dominant-baseline="central"><tspan x="313" y="231">Pronto</tspan><tspan x="313" y="248" font-size="11">só falta a vez</tspan></text><line x1="146" y1="70" x2="88" y2="206" stroke="#1C1C2E" stroke-width="1.6" marker-end="url(#a)"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11.5" fill="#1C1C2E" text-anchor="end"><tspan x="108" y="126">1. pediu algo</tspan><tspan x="108" y="141">e vai esperar</tspan></text><line x1="160" y1="238" x2="234" y2="238" stroke="#1C1C2E" stroke-width="1.6" marker-end="url(#a)"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11.5" fill="#1C1C2E" text-anchor="middle"><tspan x="197" y="284">2. chegou o que</tspan><tspan x="197" y="299">ele esperava</tspan></text><line x1="286" y1="206" x2="228" y2="72" stroke="#1C1C2E" stroke-width="1.6" marker-end="url(#a)"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11.5" fill="#1C1C2E" text-anchor="start"><tspan x="222" y="126">3. chegou</tspan><tspan x="222" y="141">a vez dele</tspan></text><line x1="258" y1="74" x2="318" y2="206" stroke="#1C1C2E" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#a)"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11.5" fill="#1C1C2E" text-anchor="start"><tspan x="324" y="126">4. acabou</tspan><tspan x="324" y="141">o tempo</tspan></text></svg>
