<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Passo a passo de uma chamada de sistema: o programa chama a biblioteca, que executa TRAP; o núcleo faz o serviço e o resultado volta ao programa"><title>Passo a passo de uma chamada de sistema: o programa chama a biblioteca, que executa TRAP; o núcleo faz o serviço e o resultado volta ao programa</title><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1C1C2E"/></marker><marker id="c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#F4845F"/></marker></defs><rect x="10" y="6" width="104" height="30" rx="10" fill="#DCEBFA" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" font-weight="700" fill="#1C1C2E" text-anchor="middle" dominant-baseline="central"><tspan x="62.0" y="21.0">Programa</tspan></text><line x1="62" y1="36" x2="62" y2="388" stroke="#9AA0AE" stroke-width="1.2" stroke-dasharray="6 4"/><rect x="148" y="6" width="104" height="30" rx="10" fill="#DCEBFA" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" font-weight="700" fill="#1C1C2E" text-anchor="middle" dominant-baseline="central"><tspan x="200.0" y="21.0">Biblioteca</tspan></text><line x1="200" y1="36" x2="200" y2="388" stroke="#9AA0AE" stroke-width="1.2" stroke-dasharray="6 4"/><rect x="286" y="6" width="104" height="30" rx="10" fill="#DDF3E7" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" font-weight="700" fill="#1C1C2E" text-anchor="middle" dominant-baseline="central"><tspan x="338.0" y="21.0">Núcleo (SO)</tspan></text><line x1="338" y1="36" x2="338" y2="388" stroke="#9AA0AE" stroke-width="1.2" stroke-dasharray="6 4"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11.5" font-weight="400" fill="#1C1C2E" text-anchor="middle" dominant-baseline="central"><tspan x="131" y="60.0">1  read(fd, buf, n)</tspan></text><line x1="62" y1="76" x2="196" y2="76" stroke="#1C1C2E" stroke-width="1.6" marker-end="url(#a)"/><rect x="112" y="94" width="176" height="38" rx="10" fill="#FFFFFF" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11.5" font-weight="400" fill="#1C1C2E" text-anchor="middle" dominant-baseline="central"><tspan x="200.0" y="105.5">2  põe o número da chamada</tspan><tspan x="200.0" y="120.5">num registrador</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11.5" font-weight="400" fill="#1C1C2E" text-anchor="middle" dominant-baseline="central"><tspan x="269" y="152.5">3  TRAP: passa para</tspan><tspan x="269" y="167.5">o modo núcleo</tspan></text><line x1="200" y1="184" x2="334" y2="184" stroke="#F4845F" stroke-width="2.2" marker-end="url(#c)"/><rect x="276" y="204" width="120" height="58" rx="10" fill="#FFFFFF" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11.5" font-weight="400" fill="#1C1C2E" text-anchor="middle" dominant-baseline="central"><tspan x="336.0" y="218.1">4  escolhe a rotina</tspan><tspan x="336.0" y="233.0">e faz o serviço</tspan><tspan x="336.0" y="248.0">(ex.: lê o disco)</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11.5" font-weight="400" fill="#1C1C2E" text-anchor="middle" dominant-baseline="central"><tspan x="269" y="276.5">5  volta ao</tspan><tspan x="269" y="291.5">modo usuário</tspan></text><line x1="334" y1="306" x2="204" y2="306" stroke="#1C1C2E" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#a)"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-