<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 312" width="300" height="312" role="img" aria-label="Oito pedaços de memória dispostos em círculo, cada um com uma marca de usado ou não usado, e um ponteiro que gira apontando para o próximo candidato a sair"><title>Oito pedaços de memória dispostos em círculo, cada um com uma marca de usado ou não usado, e um ponteiro que gira apontando para o próximo candidato a sair</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#F4845F"/></marker></defs><circle cx="150" cy="150" r="100" fill="none" stroke="#1C1C2E" stroke-width="1.4" stroke-dasharray="4 5"/><circle cx="150" cy="50" r="23" fill="#FDE7DF" stroke="#1C1C2E" stroke-width="1.6"/><circle cx="221" cy="79" r="23" fill="#DCEBFA" stroke="#1C1C2E" stroke-width="1.6"/><circle cx="250" cy="150" r="23" fill="#DCEBFA" stroke="#1C1C2E" stroke-width="1.6"/><circle cx="221" cy="221" r="23" fill="#FDE7DF" stroke="#1C1C2E" stroke-width="1.6"/><circle cx="150" cy="250" r="23" fill="#DCEBFA" stroke="#1C1C2E" stroke-width="1.6"/><circle cx="79" cy="221" r="23" fill="#FDE7DF" stroke="#1C1C2E" stroke-width="1.6"/><circle cx="50" cy="150" r="23" fill="#DCEBFA" stroke="#1C1C2E" stroke-width="1.6"/><circle cx="79" cy="79" r="23" fill="#DCEBFA" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12.5" fill="#1C1C2E" text-anchor="middle" dominant-baseline="central"><tspan x="150" y="50">0</tspan><tspan x="221" y="79">1</tspan><tspan x="250" y="150">1</tspan><tspan x="221" y="221">0</tspan><tspan x="150" y="250">1</tspan><tspan x="79" y="221">0</tspan><tspan x="50" y="150">1</tspan><tspan x="79" y="79">1</tspan></text><line x1="150" y1="150" x2="150" y2="80" stroke="#F4845F" stroke-width="3" marker-end="url(#a)"/><circle cx="150" cy="150" r="5" fill="#1C1C2E"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" fill="#1C1C2E" text-anchor="middle"><tspan x="150" y="292">1 quer dizer usado desde a última olhada, e 0 quer dizer não usado.</tspan><tspan x="150" y="306">O ponteiro anda: quem está com 1 vira 0, e quem já está com 0 sai.</tspan></text></svg>
