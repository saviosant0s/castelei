<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="400" height="250" role="img" aria-label="Dois circuitos com uma pilha e uma lâmpada. No de cima, os interruptores p e q estão em fila, um depois do outro: a lâmpada só acende se os dois estiverem ligados, como o “e”. No de baixo, os interruptores estão lado a lado, em caminhos separados: basta um ligado para a lâmpada acender, como o “ou”."><title>Dois circuitos com uma pilha e uma lâmpada. No de cima, os interruptores p e q estão em fila, um depois do outro: a lâmpada só acende se os dois estiverem ligados, como o “e”. No de baixo, os interruptores estão lado a lado, em caminhos separados: basta um ligado para a lâmpada acender, como o “ou”.</title><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="700" fill="#1C1C2E" text-anchor="middle"><tspan x="200" y="18">“e”: em fila</tspan></text><rect x="20" y="48" width="14" height="32" rx="2" fill="#F3E6B3" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="9.5" font-weight="600" fill="#1C1C2E" fill-opacity="0.8" text-anchor="middle"><tspan x="27" y="42">pilha</tspan></text><circle cx="352" cy="64" r="14" fill="#F3E6B3" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="9.5" font-weight="600" fill="#1C1C2E" fill-opacity="0.8" text-anchor="middle"><tspan x="352" y="96">lâmpada</tspan></text><path d="M 34 64 L 110 64" fill="none" stroke="#1C1C2E" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="110" cy="64" r="3" fill="#1C1C2E" stroke="#1C1C2E" stroke-width="0"/><circle cx="140" cy="64" r="3" fill="#1C1C2E" stroke="#1C1C2E" stroke-width="0"/><path d="M 110 64 L 136 52" fill="none" stroke="#1C1C2E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11.5