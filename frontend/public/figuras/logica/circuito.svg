"#1C1C2E" stroke="#1C1C2E" stroke-width="0"/><path d="M 160 176 L 186 164" fill="none" stroke="#1C1C2E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11.5" font-weight="700" fill="#2F6FB0" text-anchor="middle"><tspan x="175" y="158">p</tspan></text><path d="M 190 176 L 270 176 L 270 190 L 338 190" fill="none" stroke="#1C1C2E" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M 90 190 L 90 210 L 160 210" fill="none" stroke="#1C1C2E" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="160" cy="210" r="3" fill="#1C1C2E" stroke="#1C1C2E" stroke-width="0"/><circle cx="190" cy="210" r="3" fill="#1C1C2E" stroke="#1C1C2E" stroke-width="0"/><path d="M 160 210 L 186 198" fill="none" stroke="#1C1C2E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11.5" font-weight="700" fill="#2F6FB0" text-anchor="middle"><tspan x="175" y="192">q</tspan></text><path d="M 190 210 L 270 210 L 270 190" fill="none" stroke="#1C1C2E" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>