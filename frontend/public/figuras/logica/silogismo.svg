<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 210" width="400" height="210" role="img" aria-label="Três círculos, um dentro do outro. O maior é “animais”, o do meio é “mamíferos” e o menor é “gatos”. Um ponto chamado Mimi está dentro do círculo dos gatos, e por isso também está dentro dos mamíferos e dos animais."><title>Três círculos, um dentro do outro. O maior é “animais”, o do meio é “mamíferos” e o menor é “gatos”. Um ponto chamado Mimi está dentro do círculo dos gatos, e por isso também está dentro dos mamíferos e dos animais.</title><ellipse cx="200" cy="110" rx="170" ry="92" fill="#ECEBE6" fill-opacity="0.6" stroke="#1C1C2E" stroke-width="1.6"/><ellipse cx="200" cy="124" rx="112" ry="66" fill="#DCEBFA" fill-opacity="0.6" stroke="#1C1C2E" stroke-width="1.6"/><ellipse cx="200" cy="138" rx="56" ry="40" fill="#DDF3E7" fill-opacity="0.9" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="700" fill="#1C1C2E" text-anchor="middle"><tspan x="200" y="34">animais</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="700" fill="#1C1C2E" text-anchor="middle"><tspan x="200" y="76">mamíferos</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="700" fill="#1C1C2E" text-anchor="middle"><tspan x="200" y="120">gatos</tspan></text><circle cx="200" cy="146" r="4" fill="#C45A34" stroke="#1C1C2E" stroke-width="0"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" font-weight="700" fill="#C45A34" text-anchor="start"><tspan x="210" y="160">Mimi</tspan></text></svg>