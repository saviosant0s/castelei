<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 236" width="400" height="236" role="img" aria-label="Uma grade de quatro casas para a promessa “se fizer sol, vou à praia”. Fez sol e fui: promessa cumprida, verdadeira. Fez sol e não fui: promessa quebrada, a única casa falsa, destacada em vermelho claro. Não fez sol e fui: verdadeira. Não fez sol e não fui: verdadeira. Quando não faz sol, a promessa não diz nada, e não é quebrada."><title>Uma grade de quatro casas para a promessa “se fizer sol, vou à praia”. Fez sol e fui: promessa cumprida, verdadeira. Fez sol e não fui: promessa quebrada, a única casa falsa, destacada em vermelho claro. Não fez sol e fui: verdadeira. Não fez sol e não fui: verdadeira. Quando não faz sol, a promessa não diz nada, e não é quebrada.</title><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11.5" font-weight="700" fill="#1C1C2E" text-anchor="middle"><tspan x="200" y="18">promessa: se fizer sol, vou à praia</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" font-weight="700" fill="#1C1C2E" text-anchor="middle"><tspan x="195.0" y="46">fui à praia</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" font-weight="700" fill="#1C1C2E" text-anchor="middle"><tspan x="325.0" y="46">não fui</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" font-weight="700" fill="#1C1C2E" text-anchor="end"><tspan x="120" y="95.0">fez sol</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" font-weight="700" fill="#1C1C2E" text-anchor="end"><tspan x="120" y="165.0">não fez sol</tspan></text><rect x="130" y="56" width="130" height="70" rx="0" fill="#DDF3E7" stroke="#1C1C2E" stroke-width="1"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="18" font-weight="700" fill="#1C1C2E" text-anchor="middle"><tspan x="195.0" y="88">V</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="9.5" font-weight="600" fill="#1C1C2E" text-anchor="middle"><tspan x="195.0" y="108">cumpriu</tspan></text><rect x="260" y="56" width="130" height="70" rx="0" fill="#FDE7DF" stroke="#1C1C2E" stroke-width="1"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="18" font-weight="700" fill="#1C1C2E" text-anchor="middle"><tspan x="325.0" y="88">F</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="9.5" font-weight="600" fill="#1C1C2E" text-anchor="middle"><tspan x="325.0" y="108">quebrou a promessa</tspan></text><rect x="130" y="126" width="130" height="70" rx="0" fill="#DDF3E7" stroke="#1C1C2E" stroke-width="1"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="18" font-weight="700" fill="#1C1C2E" text-anchor="middle"><tspan x="195.0" y="158">V</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="9.5" font-weight="600" fill="#1C1C2E" text-anchor="middle"><tspan x="195.0" y="178">não prometeu nada</tspan></text><rect x="260" y="126" width="130" height="70" rx="0" fill="#DDF3E7" stroke="#1C1C2E" stroke-width="1"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="18" font-weight="700" fill="#1C1C2E" text-anchor="middle"><tspan x="325.0" y="158">V</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="9.5" font-weight="600" fill="#1C1C2E" text-anchor="middle"><tspan x="325.0" y="178">não prometeu nada</tspan></text></svg>