<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="400" height="200" role="img" aria-label="Três quadros com diagramas de dois círculos, A e B. Em “Todo A é B”, o círculo A está inteiro dentro do círculo B. Em “Algum A é B”, os círculos se cruzam, e um X marca a parte comum. Em “Nenhum A é B”, os dois círculos estão separados, sem parte comum."><title>Três quadros com diagramas de dois círculos, A e B. Em “Todo A é B”, o círculo A está inteiro dentro do círculo B. Em “Algum A é B”, os círculos se cruzam, e um X marca a parte comum. Em “Nenhum A é B”, os dois círculos estão separados, sem parte comum.</title><rect x="8" y="8" width="124" height="184" rx="7" fill="#FAFAF7" stroke="#1C1C2E" stroke-width="1.1"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11.5" font-weight="700" fill="#1C1C2E" text-anchor="middle"><tspan x="70" y="30">Todo A é B</tspan></text><rect x="140" y="8" width="124" height="184" rx="7" fill="#FAFAF7" stroke="#1C1C2E" stroke-width="1.1"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11.5" font-weight="700" fill="#1C1C2E" text-anchor="middle"><tspan x="202" y="30">Algum A é B</tspan></text><rect x="272" y="8" width="124" height="184" rx="7" fill="#FAFAF7" stroke="#1C1C2E" stroke-width="1.1"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11.5" font-weight="700" fill="#1C1C2E" text-anchor="middle"><tspan x="334" y="30">Nenhum A é B</tspan></text><ellipse cx="70" cy="110" rx="54" ry="50" fill="#DCEBFA" fill-opacity="0.5" stroke="#1C1C2E" stroke-width="1.6"/><ellipse cx="70" cy="118" rx="26" ry="24" fill="#DDF3E7" fill-opacity="0.9" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="700" fill="#1C1C2E" text-anchor="middle"><tspan x="70" y="123">A</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="700" fill="#1C1C2E" text-anchor="middle"><tspan x="70" y="76">B</tspan></text><ellipse cx="184" cy="110" rx="34" ry="34" fill="#DDF3E7" fill-opacity="0.7" stroke="#1C1C2E" stroke-width="1.6"/><ellipse cx="222" cy="110" rx="34" ry="34" fill="#DCEBFA" fill-opacity="0.5" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="700" fill="#1C1C2E" text-anchor="middle"><tspan x="170" y="114">A</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="700" fill="#1C1C2E" text-anchor="middle"><tspan x="238" y="114">B</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" font-weight="700" fill="#C45A34" text-anchor="middle"><tspan x="203" y="115">X</tspan></text><ellipse cx="300" cy="110" rx="24" ry="26" fill="#DDF3E7" fill-opacity="0.8" stroke="#1C1C2E" stroke-width="1.6"/><ellipse cx="356" cy="110" rx="24" ry="26" fill="#DCEBFA" fill-opacity="0.6" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="700" fill="#1C1C2E" text-anchor="middle"><tspan x="300" y="115">A</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="700" fill="#1C1C2E" text-anchor="middle"><tspan x="356" y="115">B</tspan></text></svg>