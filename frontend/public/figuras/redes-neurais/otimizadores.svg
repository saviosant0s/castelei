<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 210" width="400" height="210" role="img" aria-label="Curvas de nível de um vale estreito e comprido. Um caminho em zigue-zague, batendo nas paredes, representa o passo puro. Outro caminho, mais suave, segue pelo meio do vale até o fundo, representando o momentum."><title>Curvas de nível de um vale estreito e comprido. Um caminho em zigue-zague, batendo nas paredes, representa o passo puro. Outro caminho, mais suave, segue pelo meio do vale até o fundo, representando o momentum.</title><ellipse cx="220" cy="105" rx="40" ry="11" fill="none" stroke="#1C1C2E" stroke-width="1" stroke-opacity="0.4"/><ellipse cx="220" cy="105" rx="80" ry="22" fill="none" stroke="#1C1C2E" stroke-width="1" stroke-opacity="0.4"/><ellipse cx="220" cy="105" rx="120" ry="33" fill="none" stroke="#1C1C2E" stroke-width="1" stroke-opacity="0.4"/><ellipse cx="220" cy="105" rx="160" ry="44" fill="none" stroke="#1C1C2E" stroke-width="1" stroke-opacity="0.4"/><path d="M 60 60 L 90 150 L 120 70 L 150 140 L 175 80 L 195 125 L 212 100" fill="none" stroke="#C45A34" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 60 150 C 110 118, 170 108, 215 105" fill="none" stroke="#2F6FB0" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="220" cy="105" r="4" fill="#1C1C2E" stroke="#1C1C2E" stroke-width="1"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="10.5" font-weight="700" fill="#C45A34" text-anchor="start"><tspan x="60" y="178">passo puro: zigue-zague</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="10.5" font-weight="700" fill="#2F6FB0" text-anchor="start"><tspan x="60" y="196">momentum: direto ao fundo</tspan></text></svg>