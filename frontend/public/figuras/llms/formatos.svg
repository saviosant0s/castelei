<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 222" width="400" height="222" role="img" aria-label="Cinco barras, uma para cada formato de número, com o comprimento proporcional aos bits. FP32 tem 32 bits: 1 de sinal, 8 de expoente e 23 de mantissa. FP16 tem 16: 1, 5 e 10. BF16 tem 16: 1, 8 e 7. INT8 tem 8 bits de número inteiro, e INT4 tem 4."><title>Cinco barras, uma para cada formato de número, com o comprimento proporcional aos bits. FP32 tem 32 bits: 1 de sinal, 8 de expoente e 23 de mantissa. FP16 tem 16: 1, 5 e 10. BF16 tem 16: 1, 8 e 7. INT8 tem 8 bits de número inteiro, e INT4 tem 4.</title><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11.5" font-weight="700" fill="#1C1C2E" text-anchor="end"><tspan x="52" y="31">FP32</tspan></text><rect x="62" y="14" width="9.4" height="24" rx="0" fill="#FDE7DF" stroke="#1C1C2E" stroke-width="1"/><rect x="71.4" y="14" width="75.2" height="24" rx="0" fill="#DCEBFA" stroke="#1C1C2E" stroke-width="1"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="10" font-weight="700" fill="#1C1C2E" text-anchor="middle"><tspan x="109.0" y="30">8</tspan></text><rect x="146.60000000000002" y="14" width="216.20000000000002" height="24" rx="0" fill="#DDF3E7" stroke="#1C1C2E" stroke-width="1"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="10" font-weight="700" fill="#1C1C2E" text-anchor="middle"><tspan x="254.70000000000005" y="30">23</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11.5" font-weight="700" fill="#1C1C2E" text-anchor="end"><tspan x="52" y="67">FP16</tspan></text><rect x="62" y="50" width="9.4" height="24" rx="0" fill="#FDE7DF" stroke="#1C1C2E" stroke-width="1"/><rect x="71.4" y="50" width="47.0" height="24" rx="0" fill="#DCEBFA" stroke="#1C1C2E" stroke-width="1"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="10" font-weight="700" fill=