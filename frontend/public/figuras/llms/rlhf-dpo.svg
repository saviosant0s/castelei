<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 210" width="400" height="210" role="img" aria-label="Dois caminhos a partir das mesmas comparações entre duas respostas, uma preferida e outra rejeitada. Em cima, RLHF: as comparações treinam um modelo de recompensa, que dá nota às respostas, e o modelo de linguagem é ajustado para tirar notas altas. Embaixo, DPO: as comparações ajustam o modelo de linguagem direto, sem modelo de recompensa no meio."><title>Dois caminhos a partir das mesmas comparações entre duas respostas, uma preferida e outra rejeitada. Em cima, RLHF: as comparações treinam um modelo de recompensa, que dá nota às respostas, e o modelo de linguagem é ajustado para tirar notas altas. Embaixo, DPO: as comparações ajustam o modelo de linguagem direto, sem modelo de recompensa no meio.</title><rect x="6" y="76" width="104" height="52" rx="7" fill="#ECEBE6" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="10" font-weight="700" fill="#1C1C2E" text-anchor="middle"><tspan x="58.0" y="99.35">comparações:</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="10" font-weight="700" fill="#1C1C2E" text-anchor="middle"><tspan x="58.0" y="111.85">A melhor que B</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="700" fill="#2F6FB0" text-anchor="middle"><tspan x="150" y="22">RLHF</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="700" fill="#2E8B57" text-anchor="middle"><tspan x="150" y="124">DPO</tspan></text><path d="M 112 90 L 120 50" fill="none" stroke="#1C1C2E" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 121.7 56.8 L 120 50 L 115.8 55.6" fill="none" stroke="#1C1C2E" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="122" y="30" width="100" height="40" rx="7" fill="#F3E6B3" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="10.5" font-weight="700" fill="#1C1C2E" text-anchor="middle"><tspan x="172.0" y="47.2175">modelo de</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="10.5" font-weight="700" fill="#1C1C2E" text-anchor="middle"><tspan x="172.0" y="60.3425">recompensa</tspan></text><path d="M 224 50 L 250 50" fill="none" stroke="#1C1C2E" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 243.7 53.0 L 250 50 L 243.7 47.0" fill="none" stroke="#1C1C2E" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="9.5" font-weight="600" fill="#1C1C2E" text-anchor="middle"><tspan x="237" y="42">nota</tspan></text><rect x="252" y="30" width="138" height="40" rx="7" fill="#DCEBFA" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="10.5" font-weight="700" fill="#1C1C2E" text-anchor="middle"><tspan x="321.0" y="47.2175">ajusta o modelo para</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="10.5" font-weight="700" fill="#1C1C2E" text-anchor="middle"><tspan x="321.0" y="60.3425">notas altas</tspan></text><path d="M 112 115 L 250 150" fill="none" stroke="#1C1C2E" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 243.1 151.4 L 250 150 L 244.6 145.5" fill="none" stroke="#1C1C2E" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="252" y="132" width="138" height="40" rx="7" fill="#DDF3E7" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="10.5" font-weight="700" fill="#1C1C2E" text-anchor="middle"><tspan x="321.0" y="149.2175">ajusta o modelo</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="10.5" font-weight="700" fill="#1C1C2E" text-anchor="middle"><tspan x="321.0" y="162.3425">direto</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="10" font-weight="500" fill="#1C1C2E" fill-opacity="0.8" text-anchor="middle"><tspan x="200" y="200">o mesmo dado, dois jeitos de usar</tspan></text></svg>