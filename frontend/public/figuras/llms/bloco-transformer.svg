<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 318" width="400" height="318" role="img" aria-label="Um diagrama de baixo para cima. A entrada x passa por uma normalização e pela atenção, e o resultado é somado à própria entrada por um desvio lateral. Depois passa por outra normalização e pela rede feed-forward, e de novo é somado ao que entrou por outro desvio. No topo sai a saída, do mesmo tamanho da entrada."><title>Um diagrama de baixo para cima. A entrada x passa por uma normalização e pela atenção, e o resultado é somado à própria entrada por um desvio lateral. Depois passa por outra normalização e pela rede feed-forward, e de novo é somado ao que entrou por outro desvio. No topo sai a saída, do mesmo tamanho da entrada.</title><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11.5" font-weight="700" fill="#1C1C2E" text-anchor="middle"><tspan x="200" y="308">entrada x</tspan></text><path d="M 200 294 L 200 272" fill="none" stroke="#1C1C2E" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M 203.0 278.3 L 200 272 L 197.0 278.3" fill="none" stroke="#1C1C2E" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><rect x="140" y="240" width="120" height="30" rx="7" fill="#ECEBE6" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" font-weight="700" fill="#1C1C2E" text-anchor="middle"><tspan x="200.0" y="258.96">normalização</tspan></text><path d="M 200 238 L 200 222" fill="none" stroke="#1C1C2E" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M 203.0 228.3 L 200 222 L 197.0 228.3" fill="none" stroke="#1C1C2E" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><rect x="140" y="190" width="120" height="30" rx="7" fill="#DCEBFA" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="700" fill="#1C