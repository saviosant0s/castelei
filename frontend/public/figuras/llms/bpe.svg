<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 222" width="400" height="222" role="img" aria-label="Quatro linhas mostram a palavra “caixa” sendo montada. Na primeira, cinco letras separadas: c, a, i, x, a. Na segunda, a e i viraram um pedaço só, “ai”. Na terceira, “ai” e x viraram “aix”. Na quarta, c e “aix” viraram “caix”, e a palavra ficou em dois pedaços: “caix” e “a”."><title>Quatro linhas mostram a palavra “caixa” sendo montada. Na primeira, cinco letras separadas: c, a, i, x, a. Na segunda, a e i viraram um pedaço só, “ai”. Na terceira, “ai” e x viraram “aix”. Na quarta, c e “aix” viraram “caix”, e a palavra ficou em dois pedaços: “caix” e “a”.</title><rect x="20" y="14" width="32" height="32" rx="7" fill="#DCEBFA" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12.5" font-weight="700" fill="#1C1C2E" text-anchor="middle"><tspan x="36.0" y="34.5">c</tspan></text><rect x="58" y="14" width="32" height="32" rx="7" fill="#DCEBFA" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12.5" font-weight="700" fill="#1C1C2E" text-anchor="middle"><tspan x="74.0" y="34.5">a</tspan></text><rect x="96" y="14" width="32" height="32" rx="7" fill="#DCEBFA" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12.5" font-weight="700" fill="#1C1C2E" text-anchor="middle"><tspan x="112.0" y="34.5">i</tspan></text><rect x="134" y="14" width="32" height="32" rx="7" fill="#DCEBFA" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12.5" font-weight="700" fill="#1C1C2E" text-anchor="middle"><tspan x="150.0" y="34.5">x</tspan></text><rect x="172" y="14" width="32" height="32" rx="7" fill="#DCEBFA" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-s