<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="400" height="200" role="img" aria-label="À esquerda, um quadrado grande cinza marcado W, congelado: os pesos originais, que não mudam. À direita, somados a ele, dois retângulos finos coloridos, B alto e estreito e A baixo e largo, que multiplicados têm o mesmo tamanho de W. Só B e A são treinados."><title>À esquerda, um quadrado grande cinza marcado W, congelado: os pesos originais, que não mudam. À direita, somados a ele, dois retângulos finos coloridos, B alto e estreito e A baixo e largo, que multiplicados têm o mesmo tamanho de W. Só B e A são treinados.</title><rect x="20" y="30" width="130" height="130" rx="4" fill="#ECEBE6" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="22" font-weight="700" fill="#1C1C2E" text-anchor="middle"><tspan x="85" y="92">W</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" font-weight="600" fill="#1C1C2E" fill-opacity="0.8" text-anchor="middle"><tspan x="85" y="114">congelado</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="22" font-weight="700" fill="#1C1C2E" text-anchor="middle"><tspan x="172" y="102">+</tspan></text><rect x="196" y="30" width="24" height="130" rx="3" fill="#FDE7DF" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="14" font-weight="700" fill="#1C1C2E" text-anchor="middle"><tspan x="208" y="100">B</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="16" font-weight="700" fill="#1C1C2E" text-anchor="middle"><tspan x="232" y="100">×</tspan></text><rect x="246" y="80" width="130" height="24" rx="3" fill="#DDF3E7" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="14" font-weight="700" fill="#1C1C2E" text-anchor="middle"><tspan x="311" y="97">A</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="10.5" font-weight="600" fill="#1C1C2E" fill-opacity="0.85" text-anchor="middle"><tspan x="85" y="184">d × d números</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="10.5" font-weight="600" fill="#1C1C2E" fill-opacity="0.85" text-anchor="middle"><tspan x="286" y="184">d × r + r × d números</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="10.5" font-weight="700" fill="#2E8B57" text-anchor="middle"><tspan x="286" y="134">só estes treinam</tspan></text></svg>