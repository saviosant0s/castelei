<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 222" width="400" height="222" role="img" aria-label="Um mapa com palavras espalhadas em três grupos. Num canto, gato, cachorro e leão, bem próximos. Em outro, carro, moto e ônibus. No terceiro, feliz, alegre e contente. Palavras de sentido parecido ficam perto umas das outras."><title>Um mapa com palavras espalhadas em três grupos. Num canto, gato, cachorro e leão, bem próximos. Em outro, carro, moto e ônibus. No terceiro, feliz, alegre e contente. Palavras de sentido parecido ficam perto umas das outras.</title><rect x="12" y="10" width="376" height="200" rx="7" fill="#FAFAF7" stroke="#1C1C2E" stroke-width="1"/><ellipse cx="95" cy="66" rx="78" ry="42" fill="#DDF3E7" fill-opacity="0.55" stroke="none"/><circle cx="65" cy="46" r="4" fill="#1C1C2E" stroke="#1C1C2E" stroke-width="0"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11.5" font-weight="700" fill="#1C1C2E" text-anchor="start"><tspan x="73" y="50">gato</tspan></text><circle cx="113" cy="68" r="4" fill="#1C1C2E" stroke="#1C1C2E" stroke-width="0"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11.5" font-weight="700" fill="#1C1C2E" text-anchor="start"><tspan x="121" y="72">cachorro</tspan></text><circle cx="75" cy="90" r="4" fill="#1C1C2E" stroke="#1C1C2E" stroke-width="0"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11.5" font-weight="700" fill="#1C1C2E" text-anchor="start"><tspan x="83" y="94">leão</tspan></text><ellipse cx="300" cy="76" rx="78" ry="42" fill="#DCEBFA" fill-opacity="0.55" stroke="none"/><circle cx="270" cy="56" r="4" fill="#1C1C2E" stroke="#1C1C2E" stroke-width="0"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11.5" font-weight="700" fill="#1C1C2E" text-anchor="start"><tspan x="278" y="60">carro</tspan></text><circle cx="318" cy="78" r="4" fill="#1C1C2E" stroke="#1C1C2E" stroke-width="0"/><text 