<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="400" height="250" role="img" aria-label="Dois caminhos que se encontram. Em cima, preparado antes: documentos cortados em trechos, cada trecho vira um embedding e vai para um banco vetorial. Embaixo, na hora da pergunta: a pergunta vira embedding, o banco devolve os trechos mais parecidos, e eles entram no prompt junto com a pergunta. O modelo responde usando os trechos."><title>Dois caminhos que se encontram. Em cima, preparado antes: documentos cortados em trechos, cada trecho vira um embedding e vai para um banco vetorial. Embaixo, na hora da pergunta: a pergunta vira embedding, o banco devolve os trechos mais parecidos, e eles entram no prompt junto com a pergunta. O modelo responde usando os trechos.</title><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="10.5" font-weight="700" fill="#1C1C2E" fill-opacity="0.8" text-anchor="start"><tspan x="12" y="18">antes (uma vez)</tspan></text><rect x="10" y="28" width="84" height="30" rx="7" fill="#ECEBE6" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="10.5" font-weight="700" fill="#1C1C2E" text-anchor="middle"><tspan x="52.0" y="46.78">documentos</tspan></text><path d="M 96 43 L 104 43" fill="none" stroke="#1C1C2E" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 97.7 46.0 L 104 43 L 97.7 40.0" fill="none" stroke="#1C1C2E" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="106" y="28" width="84" height="30" rx="7" fill="#FFFFFF" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="10.5" font-weight="700" fill="#1C1C2E" text-anchor="middle"><tspan x="148.0" y="46.78">trechos</tspan></text><path d="M 192 43 L 200 43" fill="none" stroke="#1C1C2E" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 193.7 46.0 L