<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 190" width="400" height="190" role="img" aria-label="Um fluxo em três etapas, da esquerda para a direita. Pré-treino: muito texto, para prever o próximo token; sai um modelo base, que só continua textos. Ajuste com instruções: pares de pergunta e resposta escritos com cuidado. Preferências: comparações entre duas respostas, para o modelo preferir a melhor. No fim, um assistente de conversa."><title>Um fluxo em três etapas, da esquerda para a direita. Pré-treino: muito texto, para prever o próximo token; sai um modelo base, que só continua textos. Ajuste com instruções: pares de pergunta e resposta escritos com cuidado. Preferências: comparações entre duas respostas, para o modelo preferir a melhor. No fim, um assistente de conversa.</title><rect x="8" y="14" width="116" height="50" rx="7" fill="#DCEBFA" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11.5" font-weight="700" fill="#1C1C2E" text-anchor="middle"><tspan x="66.0" y="43.14">pré-treino</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="10" font-weight="500" fill="#1C1C2E" fill-opacity="0.85" text-anchor="middle"><tspan x="66" y="84.0">muito texto,</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="10" font-weight="500" fill="#1C1C2E" fill-opacity="0.85" text-anchor="middle"><tspan x="66" y="96.5">próximo token</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="10" font-weight="500" fill="#1C1C2E" fill-opacity="0.85" text-anchor="middle"><tspan x="66" y="109.0">→ modelo base</tspan></text><path d="M 126 39 L 138 39" fill="none" stroke="#1C1C2E" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M 131.7 42.0 L 138 39 L 131.7 36.0" fill="none" stroke="#1C1C2E" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>