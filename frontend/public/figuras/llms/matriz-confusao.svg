<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" width="400" height="220" role="img" aria-label="Uma tabela de dois por dois. As linhas dizem a resposta certa, sim ou não; as colunas dizem o que o modelo respondeu. Na casa certo sim e modelo sim há 3 acertos, os verdadeiros positivos. Na casa certo sim e modelo não há 1, os falsos negativos. Na casa certo não e modelo sim há 2, os falsos positivos. Na casa certo não e modelo não há 2, os verdadeiros negativos."><title>Uma tabela de dois por dois. As linhas dizem a resposta certa, sim ou não; as colunas dizem o que o modelo respondeu. Na casa certo sim e modelo sim há 3 acertos, os verdadeiros positivos. Na casa certo sim e modelo não há 1, os falsos negativos. Na casa certo não e modelo sim há 2, os falsos positivos. Na casa certo não e modelo não há 2, os verdadeiros negativos.</title><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="10.5" font-weight="700" fill="#1C1C2E" fill-opacity="0.85" text-anchor="middle"><tspan x="260" y="20">o modelo disse</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" font-weight="700" fill="#1C1C2E" text-anchor="middle"><tspan x="198.0" y="40">sim</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" font-weight="700" fill="#1C1C2E" text-anchor="middle"><tspan x="322.0" y="40">não</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="10.5" font-weight="700" fill="#1C1C2E" fill-opacity="0.85" text-anchor="middle"><tspan x="58" y="70">certo:</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" font-weight="700" fill="#1C1C2E" text-anchor="end"><tspan x="118" y="86.0">sim</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" font-weight="700" fill="#1C1C2E" text-anchor="end"><tspan x="118" y="150.0">não</tspan></text><rect x="136" y="50" width="124" height="64" rx="0" fill="#DDF3E7" stroke="#1C1C2E" stroke-width="1"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="18" font-weight="700" fill="#1C1C2E" text-anchor="middle"><tspan x="198.0" y="80">3</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="9.5" font-weight="600" fill="#1C1C2E" text-anchor="middle"><tspan x="198.0" y="100">verdadeiro positivo</tspan></text><rect x="260" y="50" width="124" height="64" rx="0" fill="#FDE7DF" stroke="#1C1C2E" stroke-width="1"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="18" font-weight="700" fill="#1C1C2E" text-anchor="middle"><tspan x="322.0" y="80">1</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="9.5" font-weight="600" fill="#1C1C2E" text-anchor="middle"><tspan x="322.0" y="100">falso negativo</tspan></text><rect x="136" y="114" width="124" height="64" rx="0" fill="#FDE7DF" stroke="#1C1C2E" stroke-width="1"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="18" font-weight="700" fill="#1C1C2E" text-anchor="middle"><tspan x="198.0" y="144">2</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="9.5" font-weight="600" fill="#1C1C2E" text-anchor="middle"><tspan x="198.0" y="164">falso positivo</tspan></text><rect x="260" y="114" width="124" height="64" rx="0" fill="#DDF3E7" stroke="#1C1C2E" stroke-width="1"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="18" font-weight="700" fill="#1C1C2E" text-anchor="middle"><tspan x="322.0" y="144">2</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="9.5" font-weight="600" fill="#1C1C2E" text-anchor="middle"><tspan x="322.0" y="164">verdadeiro negativo</tspan></text></svg>