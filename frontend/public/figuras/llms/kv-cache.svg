<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 215" width="400" height="215" role="img" aria-label="Uma fila de caixas representando os tokens já escritos: “O”, “gato”, “subiu”, “no”. Embaixo de cada um, guardados numa gaveta chamada cache, estão a chave e o valor dele. Um token novo, “telhado”, calcula só a própria consulta, chave e valor, e olha para a gaveta em vez de recalcular os antigos."><title>Uma fila de caixas representando os tokens já escritos: “O”, “gato”, “subiu”, “no”. Embaixo de cada um, guardados numa gaveta chamada cache, estão a chave e o valor dele. Um token novo, “telhado”, calcula só a própria consulta, chave e valor, e olha para a gaveta em vez de recalcular os antigos.</title><rect x="10" y="96" width="268" height="64" rx="7" fill="#FAFAF7" stroke="#1C1C2E" stroke-width="1.1" stroke-dasharray="5 4"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="10.5" font-weight="600" fill="#1C1C2E" fill-opacity="0.85" text-anchor="middle"><tspan x="144" y="180">cache: chaves e valores já calculados</tspan></text><rect x="18" y="22" width="56" height="30" rx="7" fill="#DCEBFA" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11.5" font-weight="700" fill="#1C1C2E" text-anchor="middle"><tspan x="46.0" y="41.14">O</tspan></text><path d="M 46 54 L 46 100" fill="none" stroke="#1C1C2E" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M 43.0 93.7 L 46 100 L 49.0 93.7" fill="none" stroke="#1C1C2E" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><rect x="22" y="104" width="22" height="48" rx="3" fill="#DDF3E7" stroke="#1C1C2E" stroke-width="1"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="10.5" font-weight="700" fill="#1C1C2E" text-anchor="middle"><tspan x="33" y="132">K</tspan></text><rect x="48" y="104" width="22" height="48" rx="3" fill="#F3E6B3" stroke="#1C1C2E" stroke-width="1"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="10.5" font-weight="700" fill="#1C1C2E" text-anchor="middle"><tspan x="59" y="132">V</tspan></text><rect x="82" y="22" width="56" height="30" rx="7" fill="#DCEBFA" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11.5" font-weight="700" fill="#1C1C2E" text-anchor="middle"><tspan x="110.0" y="41.14">gato</tspan></text><path d="M 110 54 L 110 100" fill="none" stroke="#1C1C2E" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M 107.0 93.7 L 110 100 L 113.0 93.7" fill="none" stroke="#1C1C2E" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><rect x="86" y="104" width="22" height="48" rx="3" fill="#DDF3E7" stroke="#1C1C2E" stroke-width="1"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="10.5" font-weight="700" fill="#1C1C2E" text-anchor="middle"><tspan x="97" y="132">K</tspan></text><rect x="112" y="104" width="22" height="48" rx="3" fill="#F3E6B3" stroke="#1C1C2E" stroke-width="1"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="10.5" font-weight="700" fill="#1C1C2E" text-anchor="middle"><tspan x="123" y="132">V</tspan></text><rect x="146" y="22" width="56" height="30" rx="7" fill="#DCEBFA" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11.5" font-weight="700" fill="#1C1C2E" text-anchor="middle"><tspan x="174.0" y="41.14">subiu</tspan></text><path d="M 174 54 L 174 100" fill="none" stroke="#1C1C2E" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M 171.0 93.7 L 174 100 L 177.0 93.7" fill="none" stroke="#1C1C2E" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><rect x="150" y="104" width="22" height="48" rx="3" fill="#DDF3E7" stroke="#1C1C2E" stroke-width="1"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="10.5" font-weight="700" fill="#1C1C2E" text-anchor="middle"><tspan x="161" y="132">K</tspan></text><rect x="176" y="104" width="22" height="48" rx="3" fill="#F3E6B3" stroke="#1C1C2E" stroke-width="1"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="10.5" font-weight="700" fill="#1C1C2E" text-anchor="middle"><tspan x="187" y="132">V</tspan></text><rect x="210" y="22" width="56" height="30" rx="7" fill="#DCEBFA" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11.5" font-weight="700" fill="#1C1C2E" text-anchor="middle"><tspan x="238.0" y="41.14">no</tspan></text><path d="M 238 54 L 238 100" fill="none" stroke="#1C1C2E" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M 235.0 93.7 L 238 100 L 241.0 93.7" fill="none" stroke="#1C1C2E" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><rect x="214" y="104" width="22" height="48" rx="3" fill="#DDF3E7" stroke="#1C1C2E" stroke-width="1"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="10.5" font-weight="700" fill="#1C1C2E" text-anchor="middle"><tspan x="225" y="132">K</tspan></text><rect x="240" y="104" width="22" height="48" rx="3" fill="#F3E6B3" stroke="#1C1C2E" stroke-width="1"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="10.5" font-weight="700" fill="#1C1C2E" text-anchor="middle"><tspan x="251" y="132">V</tspan></text><rect x="300" y="22" width="88" height="30" rx="7" fill="#FDE7DF" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11.5" font-weight="700" fill="#1C1C2E" text-anchor="middle"><tspan x="344.0" y="41.14">telhado</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="10" font-weight="600" fill="#1C1C2E" text-anchor="middle"><tspan x="344" y="72">calcula só</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="10" font-weight="600" fill="#1C1C2E" text-anchor="middle"><tspan x="344" y="85">o seu Q, K e V</tspan></text><path d="M 300 124 L 282 124" fill="none" stroke="#1C1C2E" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M 288.3 121.0 L 282 124 L 288.3 127.0" fill="none" stroke="#1C1C2E" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="10" font-weight="600" fill="#1C1C2E" text-anchor="middle"><tspan x="344" y="120">olha a</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="10" font-weight="600" fill="#1C1C2E" text-anchor="middle"><tspan x="344" y="133">gaveta</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="10" font-weight="500" fill="#1C1C2E" fill-opacity="0.8" text-anchor="middle"><tspan x="200" y="206">sem cache, cada token novo recalcularia todos os anteriores</tspan></text></svg>