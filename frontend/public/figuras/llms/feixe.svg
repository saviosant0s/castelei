"round" stroke-linejoin="round"/><path d="M 205.4 92.6 L 212 95 L 209.8 88.4" fill="none" stroke="#1C1C2E" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/><rect x="214" y="82" width="80" height="26" rx="7" fill="#FFFFFF" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" font-weight="700" fill="#1C1C2E" text-anchor="middle"><tspan x="254.0" y="98.96">rato 0,3</tspan></text><path d="M 178 160 L 212 141" fill="none" stroke="#1C1C2E" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/><path d="M 208.0 146.7 L 212 141 L 205.0 141.4" fill="none" stroke="#1C1C2E" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/><rect x="214" y="128" width="80" height="26" rx="7" fill="#DDF3E7" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" font-weight="700" fill="#1C1C2E" text-anchor="middle"><tspan x="254.0" y="144.96">gato 0,9</tspan></text><path d="M 178 160 L 212 177" fill="none" stroke="#1C1C2E" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/><path d="M 205.0 176.9 L 212 177 L 207.7 171.5" fill="none" stroke="#1C1C2E" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/><rect x="214" y="164" width="80" height="26" rx="7" fill="#FFFFFF" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" font-weight="700" fill="#1C1C2E" text-anchor="middle"><tspan x="254.0" y="180.96">cão 0,1</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="10.5" font-weight="700" fill="#C45A34" text-anchor="start"><tspan x="300" y="27">guloso: 0,175</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="10.5" font-weight="700" fill="#2E8B57" text-anchor="start"><tspan x="300" y="145">feixe: 0,36</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="10" font-weight="500" fill="#1C1C2E" fill-opacity="0.8" text-anchor="middle"><tspan x="200" y="252">a chance de um texto é o produto das chances de cada passo</tspan></text></svg>