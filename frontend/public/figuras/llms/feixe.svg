<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="400" height="260" role="img" aria-label="Uma árvore de escolhas em dois passos. Do começo saem três ramos: “o” com 0,5, “um” com 0,4 e “a” com 0,1. De “o” saem “gato” 0,35, “cão” 0,35 e “rato” 0,3; de “um” saem “gato” 0,9 e “cão” 0,1. O caminho guloso, sempre pela maior chance do passo, dá “o gato”, com 0,5 × 0,35 = 0,175. O caminho da busca em feixe dá “um gato”, com 0,4 × 0,9 = 0,36."><title>Uma árvore de escolhas em dois passos. Do começo saem três ramos: “o” com 0,5, “um” com 0,4 e “a” com 0,1. De “o” saem “gato” 0,35, “cão” 0,35 e “rato” 0,3; de “um” saem “gato” 0,9 e “cão” 0,1. O caminho guloso, sempre pela maior chance do passo, dá “o gato”, com 0,5 × 0,35 = 0,175. O caminho da busca em feixe dá “um gato”, com 0,4 × 0,9 = 0,36.</title><rect x="8" y="110" width="56" height="30" rx="7" fill="#ECEBE6" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" font-weight="700" fill="#1C1C2E" text-anchor="middle"><tspan x="36.0" y="128.96">início</tspan></text><path d="M 66 125 L 104 60" fill="none" stroke="#1C1C2E" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 103.4 67.0 L 104 60 L 98.2 63.9" fill="none" stroke="#1C1C2E" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="106" y="45" width="70" height="30" rx="7" fill="#FDE7DF" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11.5" font-weight="700" fill="#1C1C2E" text-anchor="middle"><tspan x="141.0" y="64.14">o 0,5</tspan></text><path d="M 66 125 L 104 160" fill="none" stroke="#1C1C2E" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 97.3 158.0 L 104 160 L 101.4 153.5" fill="none" stroke="#1C1C2E" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="106" y="145" width="70" height="30" rx="7" fill="#DDF3E7