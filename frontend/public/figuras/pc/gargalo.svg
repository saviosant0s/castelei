<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 228" width="400" height="228" role="img" aria-label="Duas garrafas lado a lado. Na da esquerda, o gargalo é estreito e a água sai devagar, mesmo com a garrafa cheia: é um processador fraco segurando uma placa de vídeo forte. Na da direita, o gargalo é largo e a água sai à vontade: as peças estão equilibradas."><title>Duas garrafas lado a lado. Na da esquerda, o gargalo é estreito e a água sai devagar, mesmo com a garrafa cheia: é um processador fraco segurando uma placa de vídeo forte. Na da direita, o gargalo é largo e a água sai à vontade: as peças estão equilibradas.</title><path d="M 60 190 L 60 90 Q 60 70 104.0 60 L 104.0 30 L 116.0 30 L 116.0 60 Q 160 70 160 90 L 160 190 Z" fill="#DCEBFA" stroke="#1C1C2E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" font-weight="700" fill="#1C1C2E" text-anchor="middle"><tspan x="110" y="150">placa forte</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="10.5" font-weight="700" fill="#1C1C2E" fill-opacity="0.85" text-anchor="middle"><tspan x="110" y="206">gargalo:</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="10.5" font-weight="500" fill="#1C1C2E" fill-opacity="0.85" text-anchor="middle"><tspan x="110" y="219">processador fraco</tspan></text><path d="M 240 190 L 240 90 Q 240 70 268.0 60 L 268.0 30 L 312.0 30 L 312.0 60 Q 340 70 340 90 L 340 190 Z" fill="#DCEBFA" stroke="#1C1C2E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" font-weight="700" fill="#1C1C2E" text-anchor="middle"><tspan x="290" y="150">placa forte</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="10.5" font-weight="700" fill="#1C1C2E" fill-opacity="0.85" text-anchor="middle"><tspan x="290" y="206">equilíbrio:</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="10.5" font-weight="500" fill="#1C1C2E" fill-opacity="0.85" text-anchor="middle"><tspan x="290" y="219">processador à altura</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="10" font-weight="700" fill="#C45A34" text-anchor="middle"><tspan x="110" y="22">pouca saída</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="10" font-weight="700" fill="#2E8B57" text-anchor="middle"><tspan x="290" y="22">boa saída</tspan></text></svg>