<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="400" height="260" role="img" aria-label="Um diagrama do computador com a placa-mãe no centro, como uma grande base. Ligados a ela estão o processador, a memória RAM, a placa de vídeo e o armazenamento. A fonte, ao lado, manda energia para todos. Cada peça tem uma frase curta: o processador pensa, a RAM é a mesa de trabalho, o armazenamento é o armário, a placa de vídeo desenha a imagem e a fonte dá energia."><title>Um diagrama do computador com a placa-mãe no centro, como uma grande base. Ligados a ela estão o processador, a memória RAM, a placa de vídeo e o armazenamento. A fonte, ao lado, manda energia para todos. Cada peça tem uma frase curta: o processador pensa, a RAM é a mesa de trabalho, o armazenamento é o armário, a placa de vídeo desenha a imagem e a fonte dá energia.</title><rect x="100" y="70" width="200" height="120" rx="7" fill="#ECEBE6" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" font-weight="700" fill="#1C1C2E" text-anchor="middle"><tspan x="200" y="136">placa-mãe</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="10.5" font-weight="500" fill="#1C1C2E" fill-opacity="0.8" text-anchor="middle"><tspan x="200" y="152">liga tudo</tspan></text><rect x="20" y="10" width="100" height="42" rx="7" fill="#DCEBFA" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="10.5" font-weight="700" fill="#1C1C2E" text-anchor="middle"><tspan x="70.0" y="28">processador</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="9.5" font-weight="500" fill="#1C1C2E" fill-opacity="0.85" text-anchor="middle"><tspan x="70.0" y="43">pensa</tspan></text><rect x="150" y="10" width="100" height="42" rx="7" fill="#DDF3E7" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="10.5" font-weight="700" fill="#1C1C2E" text-anchor="middle"><tspan x="200.0" y="28">memória RAM</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="9.5" font-weight="500" fill="#1C1C2E" fill-opacity="0.85" text-anchor="middle"><tspan x="200.0" y="43">mesa de trabalho</tspan></text><rect x="280" y="10" width="100" height="42" rx="7" fill="#FDE7DF" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="10.5" font-weight="700" fill="#1C1C2E" text-anchor="middle"><tspan x="330.0" y="28">placa de vídeo</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="9.5" font-weight="500" fill="#1C1C2E" fill-opacity="0.85" text-anchor="middle"><tspan x="330.0" y="43">desenha a imagem</tspan></text><rect x="140" y="210" width="120" height="42" rx="7" fill="#F3E6B3" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="10.5" font-weight="700" fill="#1C1C2E" text-anchor="middle"><tspan x="200.0" y="228">armazenamento</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="9.5" font-weight="500" fill="#1C1C2E" fill-opacity="0.85" text-anchor="middle"><tspan x="200.0" y="243">armário</tspan></text><path d="M 70 52 L 140 70" fill="none" stroke="#1C1C2E" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M 200 52 L 200 70" fill="none" stroke="#1C1C2E" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M 330 52 L 260 70" fill="none" stroke="#1C1C2E" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M 200 190 L 200 210" fill="none" stroke="#1C1C2E" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><rect x="318" y="110" width="72" height="46" rx="7" fill="#E6DDF5" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" font-weight="700" fill="#1C1C2E" text-anchor="middle"><tspan x="354" y="130">fonte</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="9.5" font-weight="500" fill="#1C1C2E" fill-opacity="0.85" text-anchor="middle"><tspan x="354" y="145">dá energia</tspan></text><path d="M 318 133 L 302 133" fill="none" stroke="#1C1C2E" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M 308.3 130.0 L 302 133 L 308.3 136.0" fill="none" stroke="#1C1C2E" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><rect x="10" y="110" width="80" height="46" rx="7" fill="#FFFFFF" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" font-weight="700" fill="#1C1C2E" text-anchor="middle"><tspan x="50" y="130">cooler</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="9.5" font-weight="500" fill="#1C1C2E" fill-opacity="0.85" text-anchor="middle"><tspan x="50" y="145">esfria</tspan></text><path d="M 90 133 L 98 133" fill="none" stroke="#1C1C2E" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M 91.7 136.0 L 98 133 L 91.7 130.0" fill="none" stroke="#1C1C2E" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>