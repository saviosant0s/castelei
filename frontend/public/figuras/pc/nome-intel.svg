<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="400" height="200" role="img" aria-label="O nome “Core Ultra 7 265K” cortado em cinco pedaços coloridos. “Core Ultra” é a marca, a linha atual da Intel. “7” é a faixa, que vai de 3 a 9. “2” é a geração, a série 200. “65” é o modelo dentro da geração: maior é mais forte. “K” é o sufixo, que indica que aceita overclock."><title>O nome “Core Ultra 7 265K” cortado em cinco pedaços coloridos. “Core Ultra” é a marca, a linha atual da Intel. “7” é a faixa, que vai de 3 a 9. “2” é a geração, a série 200. “65” é o modelo dentro da geração: maior é mais forte. “K” é o sufixo, que indica que aceita overclock.</title><rect x="51.0" y="24" width="144" height="44" rx="7" fill="#DCEBFA" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="19" font-weight="700" fill="#1C1C2E" text-anchor="middle"><tspan x="123.0" y="52.84">Core Ultra</tspan></text><path d="M 123.0 70 L 123.0 84 L 20.0 98.0" fill="none" stroke="#1C1C2E" stroke-width="1" stroke-opacity="0.6" stroke-linecap="round" stroke-linejoin="round"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" font-weight="700" fill="#1C1C2E" text-anchor="start"><tspan x="20.0" y="112">marca</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="10" font-weight="500" fill="#1C1C2E" fill-opacity="0.85" text-anchor="start"><tspan x="20.0" y="126">a linha atual</tspan></text><rect x="201.0" y="24" width="30" height="44" rx="7" fill="#DDF3E7" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="19" font-weight="700" fill="#1C1C2E" text-anchor="middle"><tspan x="216.0" y="52.84">7</tspan></text><path d="M 216.0 70 L 216.0 84 L 110.0 140.0" fill="none" stroke="#1C1C2E" stroke-width="1" stroke-opacity="0.6" stroke-linecap="round" stroke-linejoin="round"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" font-weight="700" fill="#1C1C2E" text-anchor="middle"><tspan x="110.0" y="154">faixa</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="10" font-weight="500" fill="#1C1C2E" fill-opacity="0.85" text-anchor="middle"><tspan x="110.0" y="168">3, 5, 7 ou 9</tspan></text><rect x="237.0" y="24" width="30" height="44" rx="7" fill="#FDE7DF" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="19" font-weight="700" fill="#1C1C2E" text-anchor="middle"><tspan x="252.0" y="52.84">2</tspan></text><path d="M 252.0 70 L 252.0 84 L 200.0 98.0" fill="none" stroke="#1C1C2E" stroke-width="1" stroke-opacity="0.6" stroke-linecap="round" stroke-linejoin="round"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" font-weight="700" fill="#1C1C2E" text-anchor="middle"><tspan x="200.0" y="112">geração</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="10" font-weight="500" fill="#1C1C2E" fill-opacity="0.85" text-anchor="middle"><tspan x="200.0" y="126">série 200</tspan></text><rect x="273.0" y="24" width="40" height="44" rx="7" fill="#F3E6B3" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="19" font-weight="700" fill="#1C1C2E" text-anchor="middle"><tspan x="293.0" y="52.84">65</tspan></text><path d="M 293.0 70 L 293.0 84 L 290.0 140.0" fill="none" stroke="#1C1C2E" stroke-width="1" stroke-opacity="0.6" stroke-linecap="round" stroke-linejoin="round"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" font-weight="700" fill="#1C1C2E" text-anchor="middle"><tspan x="290.0" y="154">modelo</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="10" font-weight="500" fill="#1C1C2E" fill-opacity="0.85" text-anchor="middle"><tspan x="290.0" y="168">maior, mais forte</tspan></text><rect x="319.0" y="24" width="30" height="44" rx="7" fill="#E6DDF5" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="19" font-weight="700" fill="#1C1C2E" text-anchor="middle"><tspan x="334.0" y="52.84">K</tspan></text><path d="M 334.0 70 L 334.0 84 L 380.0 98.0" fill="none" stroke="#1C1C2E" stroke-width="1" stroke-opacity="0.6" stroke-linecap="round" stroke-linejoin="round"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" font-weight="700" fill="#1C1C2E" text-anchor="end"><tspan x="380.0" y="112">sufixo</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="10" font-weight="500" fill="#1C1C2E" fill-opacity="0.85" text-anchor="end"><tspan x="380.0" y="126">K: overclock</tspan></text></svg>