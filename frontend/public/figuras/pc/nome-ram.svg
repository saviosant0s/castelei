<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="400" height="200" role="img" aria-label="A descrição “DDR5 6000 CL30 2×16 GB” cortada em quatro pedaços. “DDR5” é o tipo, a geração da memória. “6000” é a velocidade, em milhões de transferências por segundo. “CL30” é a latência, o tempo de resposta em ciclos: menor é melhor. “2×16 GB” é o kit, com dois pentes de 16 GB."><title>A descrição “DDR5 6000 CL30 2×16 GB” cortada em quatro pedaços. “DDR5” é o tipo, a geração da memória. “6000” é a velocidade, em milhões de transferências por segundo. “CL30” é a latência, o tempo de resposta em ciclos: menor é melhor. “2×16 GB” é o kit, com dois pentes de 16 GB.</title><rect x="39.5" y="24" width="66" height="44" rx="7" fill="#DCEBFA" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="19" font-weight="700" fill="#1C1C2E" text-anchor="middle"><tspan x="72.5" y="52.84">DDR5</tspan></text><path d="M 72.5 70 L 72.5 84 L 20.0 98.0" fill="none" stroke="#1C1C2E" stroke-width="1" stroke-opacity="0.6" stroke-linecap="round" stroke-linejoin="round"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" font-weight="700" fill="#1C1C2E" text-anchor="start"><tspan x="20.0" y="112">tipo</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="10" font-weight="500" fill="#1C1C2E" fill-opacity="0.85" text-anchor="start"><tspan x="20.0" y="126">geração da memória</tspan></text><rect x="111.5" y="24" width="66" height="44" rx="7" fill="#DDF3E7" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="19" font-weight="700" fill="#1C1C2E" text-anchor="middle"><tspan x="144.5" y="52.84">6000</tspan></text><path d="M 144.5 70 L 144.5 84 L 140.0 140.0" fill="none" stroke="#1C1C2E" stroke-width="1" stroke-opacity="0.6" stroke-linecap="round" stroke-linejoin="round"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" font-weight="700" fill="#1C1C2E" text-anchor="middle"><tspan x="140.0" y="154">velocidade</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="10" font-weight="500" fill="#1C1C2E" fill-opacity="0.85" text-anchor="middle"><tspan x="140.0" y="168">em MT/s</tspan></text><rect x="183.5" y="24" width="66" height="44" rx="7" fill="#FDE7DF" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="19" font-weight="700" fill="#1C1C2E" text-anchor="middle"><tspan x="216.5" y="52.84">CL30</tspan></text><path d="M 216.5 70 L 216.5 84 L 260.0 98.0" fill="none" stroke="#1C1C2E" stroke-width="1" stroke-opacity="0.6" stroke-linecap="round" stroke-linejoin="round"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" font-weight="700" fill="#1C1C2E" text-anchor="middle"><tspan x="260.0" y="112">latência</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="10" font-weight="500" fill="#1C1C2E" fill-opacity="0.85" text-anchor="middle"><tspan x="260.0" y="126">menor é melhor</tspan></text><rect x="255.5" y="24" width="105" height="44" rx="7" fill="#F3E6B3" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="19" font-weight="700" fill="#1C1C2E" text-anchor="middle"><tspan x="308.0" y="52.84">2×16 GB</tspan></text><path d="M 308.0 70 L 308.0 84 L 380.0 140.0" fill="none" stroke="#1C1C2E" stroke-width="1" stroke-opacity="0.6" stroke-linecap="round" stroke-linejoin="round"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" font-weight="700" fill="#1C1C2E" text-anchor="end"><tspan x="380.0" y="154">kit</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="10" font-weight="500" fill="#1C1C2E" fill-opacity="0.85" text-anchor="end"><tspan x="380.0" y="168">dois pentes</tspan></text></svg>