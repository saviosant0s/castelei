<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="400" height="200" role="img" aria-label="O nome “Radeon RX 9070 XT” cortado em cinco pedaços. “Radeon” é a marca de placas de vídeo da AMD. “RX” é a família de jogos. “9” é a geração, a série 9000. “070” é a classe, numerada para lembrar a classe 70 da rival. “XT” é a versão mais forte do mesmo modelo."><title>O nome “Radeon RX 9070 XT” cortado em cinco pedaços. “Radeon” é a marca de placas de vídeo da AMD. “RX” é a família de jogos. “9” é a geração, a série 9000. “070” é a classe, numerada para lembrar a classe 70 da rival. “XT” é a versão mais forte do mesmo modelo.</title><rect x="60.5" y="24" width="92" height="44" rx="7" fill="#DCEBFA" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="19" font-weight="700" fill="#1C1C2E" text-anchor="middle"><tspan x="106.5" y="52.84">Radeon</tspan></text><path d="M 106.5 70 L 106.5 84 L 20.0 98.0" fill="none" stroke="#1C1C2E" stroke-width="1" stroke-opacity="0.6" stroke-linecap="round" stroke-linejoin="round"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" font-weight="700" fill="#1C1C2E" text-anchor="start"><tspan x="20.0" y="112">marca</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="10" font-weight="500" fill="#1C1C2E" fill-opacity="0.85" text-anchor="start"><tspan x="20.0" y="126">linha da AMD</tspan></text><rect x="158.5" y="24" width="40" height="44" rx="7" fill="#DDF3E7" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="19" font-weight="700" fill="#1C1C2E" text-anchor="middle"><tspan x="178.5" y="52.84">RX</tspan></text><path d="M 178.5 70 L 178.5 84 L 110.0 140.0" fill="none" stroke="#1C1C2E" stroke-width="1" stroke-opacity="0.6" stroke-linecap="round" stroke-linejoin="round"/><text font-family="system-ui,-apple-system,Segoe UI,Rob