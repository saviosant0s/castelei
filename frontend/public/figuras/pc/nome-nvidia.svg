<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="400" height="200" role="img" aria-label="O nome “GeForce RTX 5070 Ti” cortado em cinco pedaços. “GeForce” é a marca de jogos da NVIDIA. “RTX” é a família com ray tracing. “50” é a geração, a série 50. “70” é a classe, que vai de 50 a 90. “Ti” é a versão turbinada, um degrau acima da 5070 comum."><title>O nome “GeForce RTX 5070 Ti” cortado em cinco pedaços. “GeForce” é a marca de jogos da NVIDIA. “RTX” é a família com ray tracing. “50” é a geração, a série 50. “70” é a classe, que vai de 50 a 90. “Ti” é a versão turbinada, um degrau acima da 5070 comum.</title><rect x="49.0" y="24" width="105" height="44" rx="7" fill="#DCEBFA" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="19" font-weight="700" fill="#1C1C2E" text-anchor="middle"><tspan x="101.5" y="52.84">GeForce</tspan></text><path d="M 101.5 70 L 101.5 84 L 20.0 98.0" fill="none" stroke="#1C1C2E" stroke-width="1" stroke-opacity="0.6" stroke-linecap="round" stroke-linejoin="round"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" font-weight="700" fill="#1C1C2E" text-anchor="start"><tspan x="20.0" y="112">marca</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="10" font-weight="500" fill="#1C1C2E" fill-opacity="0.85" text-anchor="start"><tspan x="20.0" y="126">linha de jogos</tspan></text><rect x="160.0" y="24" width="53" height="44" rx="7" fill="#DDF3E7" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="19" font-weight="700" fill="#1C1C2E" text-anchor="middle"><tspan x="186.5" y="52.84">RTX</tspan></text><path d="M 186.5 70 L 186.5 84 L 110.0 140.0" fill="none" stroke="#1C1C2E" stroke-width="1" stroke-opacity="0.6" stroke-linecap="round" stroke-linejoin="round"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-se