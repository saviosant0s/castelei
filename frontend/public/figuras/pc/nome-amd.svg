<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="400" height="200" role="img" aria-label="O nome “Ryzen 7 9800X3D” cortado em seis pedaços. “Ryzen” é a marca. “7” é a faixa, de 3 a 9. “9” é a geração, a série 9000. “80” é o modelo dentro da geração. O último “0” quase sempre é zero. “X3D” é o sufixo da versão com cache extra empilhado, muito boa em jogos."><title>O nome “Ryzen 7 9800X3D” cortado em seis pedaços. “Ryzen” é a marca. “7” é a faixa, de 3 a 9. “9” é a geração, a série 9000. “80” é o modelo dentro da geração. O último “0” quase sempre é zero. “X3D” é o sufixo da versão com cache extra empilhado, muito boa em jogos.</title><rect x="54.0" y="24" width="79" height="44" rx="7" fill="#DCEBFA" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="19" font-weight="700" fill="#1C1C2E" text-anchor="middle"><tspan x="93.5" y="52.84">Ryzen</tspan></text><path d="M 93.5 70 L 93.5 84 L 20.0 98.0" fill="none" stroke="#1C1C2E" stroke-width="1" stroke-opacity="0.6" stroke-linecap="round" stroke-linejoin="round"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" font-weight="700" fill="#1C1C2E" text-anchor="start"><tspan x="20.0" y="112">marca</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="10" font-weight="500" fill="#1C1C2E" fill-opacity="0.85" text-anchor="start"><tspan x="20.0" y="126">a linha da AMD</tspan></text><rect x="139.0" y="24" width="30" height="44" rx="7" fill="#DDF3E7" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="19" font-weight="700" fill="#1C1C2E" text-anchor="middle"><tspan x="154.0" y="52.84">7</tspan></text><path d="M 154.0 70 L 154.0 84 L 92.0 140.0" fill="none" stroke="#1C1C2E" stroke-width="1" stroke-opacity="0.6" stroke-linecap="round" stroke-linejoin="round"/><text font-family="system-ui,-apple-system,Segoe 