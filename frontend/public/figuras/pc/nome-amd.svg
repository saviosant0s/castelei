.0" y="168">maior, mais forte</tspan></text><rect x="257.0" y="24" width="30" height="44" rx="7" fill="#E6DDF5" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="19" font-weight="700" fill="#1C1C2E" text-anchor="middle"><tspan x="272.0" y="52.84">0</tspan></text><path d="M 272.0 70 L 272.0 84 L 308.0 98.0" fill="none" stroke="#1C1C2E" stroke-width="1" stroke-opacity="0.6" stroke-linecap="round" stroke-linejoin="round"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" font-weight="700" fill="#1C1C2E" text-anchor="middle"><tspan x="308.0" y="112">ajuste</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="10" font-weight="500" fill="#1C1C2E" fill-opacity="0.85" text-anchor="middle"><tspan x="308.0" y="126">quase sempre 0</tspan></text><rect x="293.0" y="24" width="53" height="44" rx="7" fill="#ECEBE6" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="19" font-weight="700" fill="#1C1C2E" text-anchor="middle"><tspan x="319.5" y="52.84">X3D</tspan></text><path d="M 319.5 70 L 319.5 84 L 380.0 140.0" fill="none" stroke="#1C1C2E" stroke-width="1" stroke-opacity="0.6" stroke-linecap="round" stroke-linejoin="round"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" font-weight="700" fill="#1C1C2E" text-anchor="end"><tspan x="380.0" y="154">sufixo</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="10" font-weight="500" fill="#1C1C2E" fill-opacity="0.85" text-anchor="end"><tspan x="380.0" y="168">cache 3D extra</tspan></text></svg>