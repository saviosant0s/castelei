<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 170" width="400" height="170" role="img" aria-label="Três caixas em fila: x entra na primeira função, que dá u; u entra na segunda, que dá y. Embaixo, as rapidezes de cada passo, du/dx e dy/du, se multiplicam para dar dy/dx."><title>Três caixas em fila: x entra na primeira função, que dá u; u entra na segunda, que dá y. Embaixo, as rapidezes de cada passo, du/dx e dy/du, se multiplicam para dar dy/dx.</title><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="14" font-weight="700" fill="#1C1C2E" text-anchor="middle"><tspan x="30" y="64">x</tspan></text><rect x="60" y="40" width="100" height="40" rx="7" fill="#DCEBFA" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="700" fill="#1C1C2E" text-anchor="middle"><tspan x="110" y="65">u = f(x)</tspan></text><rect x="220" y="40" width="100" height="40" rx="7" fill="#DDF3E7" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="700" fill="#1C1C2E" text-anchor="middle"><tspan x="270" y="65">y = g(u)</tspan></text><path d="M 40 60 L 58 60" fill="none" stroke="#1C1C2E" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M 51.7 63.0 L 58 60 L 51.7 57.0" fill="none" stroke="#1C1C2E" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M 162 60 L 218 60" fill="none" stroke="#1C1C2E" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M 211.7 63.0 L 218 60 L 211.7 57.0" fill="none" stroke="#1C1C2E" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M 322 60 L 360 60" fill="none" stroke="#1C1C2E" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M 353.7 63.0 L 360 60 L 353.7 57.0" fill="none" stroke="#1C1C2E" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="14" font-weight="700" fill="#1C1C2E" text-anchor="middle"><tspan x="372" y="64">y</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="600" fill="#1C1C2E" text-anchor="middle"><tspan x="110" y="105">du/dx</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="600" fill="#1C1C2E" text-anchor="middle"><tspan x="270" y="105">dy/du</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" font-weight="700" fill="#1C1C2E" text-anchor="middle"><tspan x="200" y="145">dy/dx = dy/du × du/dx</tspan></text></svg>