<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 290" width="400" height="290" role="img" aria-label="Quatro blocos empilhados de uma redação: introdução com contexto, tese e os dois argumentos anunciados; primeiro desenvolvimento; segundo desenvolvimento; conclusão com a proposta de intervenção. Setas ligam cada argumento anunciado ao seu parágrafo."><title>Quatro blocos empilhados de uma redação: introdução com contexto, tese e os dois argumentos anunciados; primeiro desenvolvimento; segundo desenvolvimento; conclusão com a proposta de intervenção. Setas ligam cada argumento anunciado ao seu parágrafo.</title><rect x="40" y="14" width="250" height="52" rx="7" fill="#DCEBFA" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="700" fill="#1C1C2E" text-anchor="middle"><tspan x="165" y="36">Introdução</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="10.5" font-weight="400" fill="#1C1C2E" text-anchor="middle"><tspan x="165" y="53">contexto + tese + os 2 argumentos</tspan></text><rect x="40" y="82" width="250" height="52" rx="7" fill="#DDF3E7" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="700" fill="#1C1C2E" text-anchor="middle"><tspan x="165" y="104">Desenvolvimento 1</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="10.5" font-weight="400" fill="#1C1C2E" text-anchor="middle"><tspan x="165" y="121">o 1º argumento, com repertório</tspan></text><rect x="40" y="150" width="250" height="52" rx="7" fill="#DDF3E7" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="700" fill="#1C1C2E" text-anchor="middle"><tspan x="165" y="172">Desenvolvimento 2</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="10.5" font-weight="400" fill="#1C1C2E" text-anchor="middle"><tspan x="165" y="189">o 2º argumento, com repertório</tspan></text><rect x="40" y="218" width="250" height="52" rx="7" fill="#FDE7DF" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="700" fill="#1C1C2E" text-anchor="middle"><tspan x="165" y="240">Conclusão</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="10.5" font-weight="400" fill="#1C1C2E" text-anchor="middle"><tspan x="165" y="257">retoma a tese + proposta de intervenção</tspan></text><path d="M 290 40 C 312 40, 312 108, 290 108" fill="none" stroke="#1C1C2E" stroke-width="1.4" stroke-dasharray="5 4" stroke-linecap="round" stroke-linejoin="round"/><path d="M 290 40 C 328 40, 328 176, 290 176" fill="none" stroke="#1C1C2E" stroke-width="1.4" stroke-dasharray="5 4" stroke-linecap="round" stroke-linejoin="round"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="10" font-weight="600" fill="#1C1C2E" text-anchor="middle"><tspan x="366" y="110">anuncia</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="10" font-weight="600" fill="#1C1C2E" text-anchor="middle"><tspan x="366" y="123">e cumpre</tspan></text></svg>