<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 230" width="400" height="230" role="img" aria-label="Uma balança. No prato mais leve, a concessão: o ponto do outro lado, admitido. No prato mais pesado, a refutação: por que esse ponto não derruba a sua tese. A balança pende para a sua tese."><title>Uma balança. No prato mais leve, a concessão: o ponto do outro lado, admitido. No prato mais pesado, a refutação: por que esse ponto não derruba a sua tese. A balança pende para a sua tese.</title><path d="M 200 40 L 200 200" fill="none" stroke="#1C1C2E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 150 205 L 250 205" fill="none" stroke="#1C1C2E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 70 62 L 330 98" fill="none" stroke="#1C1C2E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="200" cy="80" r="5" fill="#1C1C2E" stroke="#1C1C2E" stroke-width="1.6"/><path d="M 70 62 L 45 110 M 70 62 L 95 110" fill="none" stroke="#1C1C2E" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="20" y="110" width="100" height="56" rx="7" fill="#DCEBFA" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="700" fill="#1C1C2E" text-anchor="middle"><tspan x="70" y="132">Concessão</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="10" font-weight="400" fill="#1C1C2E" text-anchor="middle"><tspan x="70" y="150.0">admite o ponto</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="10" font-weight="400" fill="#1C1C2E" text-anchor="middle"><tspan x="70" y="162.5">do outro lado</tspan></text><path d="M 330 98 L 305 146 M 330 98 L 355 146" fill="none" stroke="#1C1C2E" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="280" y="146" width="100" height="56" rx="7" fill="#FDE7DF" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="700" fill="#1C1C2E" text-anchor="middle"><tspan x="330" y="168">Refutação</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="10" font-weight="400" fill="#1C1C2E" text-anchor="middle"><tspan x="330" y="186.0">mostra por que</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="10" font-weight="400" fill="#1C1C2E" text-anchor="middle"><tspan x="330" y="198.5">ele não derruba</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" font-weight="600" fill="#1C1C2E" text-anchor="middle"><tspan x="200" y="26">a balança pende para a sua tese</tspan></text></svg>