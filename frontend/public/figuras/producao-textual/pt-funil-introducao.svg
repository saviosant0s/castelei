<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" width="400" height="220" role="img" aria-label="Um funil com três faixas, da mais larga para a mais estreita: o tema, amplo; a discussão, que mostra por que o tema divide opiniões; e, na ponta, a tese, a posição do autor."><title>Um funil com três faixas, da mais larga para a mais estreita: o tema, amplo; a discussão, que mostra por que o tema divide opiniões; e, na ponta, a tese, a posição do autor.</title><path d="M 40 18 L 360 18 L 335 74 L 65 74 Z" fill="#DCEBFA" stroke="#1C1C2E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="700" fill="#1C1C2E" text-anchor="middle"><tspan x="200" y="43">O tema</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="10.5" font-weight="400" fill="#1C1C2E" text-anchor="middle"><tspan x="200" y="59">do que o texto fala</tspan></text><path d="M 90 82 L 310 82 L 285 138 L 115 138 Z" fill="#FFFFFF" stroke="#1C1C2E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="700" fill="#1C1C2E" text-anchor="middle"><tspan x="200" y="107">A discussão</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="10.5" font-weight="400" fill="#1C1C2E" text-anchor="middle"><tspan x="200" y="123">por que o tema divide opiniões</tspan></text><path d="M 115 146 L 285 146 L 260 202 L 140 202 Z" fill="#FDE7DF" stroke="#1C1C2E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="700" fill="#1C1C2E" text-anchor="middle"><tspan x="200" y="171">A tese</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="10.5" font-weight="400" fill="#1C1C2E" text-anchor="middle"><tspan x="200" y="187">o que você defende</tspan></text></svg>