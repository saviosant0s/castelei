<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 150" width="400" height="150" role="img" aria-label="Cinco peças de uma proposta de intervenção lado a lado: quem faz, o que faz, como faz, para quê e um detalhe a mais."><title>Cinco peças de uma proposta de intervenção lado a lado: quem faz, o que faz, como faz, para quê e um detalhe a mais.</title><rect x="12" y="40" width="70" height="64" rx="7" fill="#DCEBFA" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11.5" font-weight="700" fill="#1C1C2E" text-anchor="middle"><tspan x="47" y="67">Quem</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="10" font-weight="400" fill="#1C1C2E" text-anchor="middle"><tspan x="47" y="84">agente</tspan></text><rect x="88" y="40" width="70" height="64" rx="7" fill="#DDF3E7" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11.5" font-weight="700" fill="#1C1C2E" text-anchor="middle"><tspan x="123" y="67">O quê</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="10" font-weight="400" fill="#1C1C2E" text-anchor="middle"><tspan x="123" y="84">ação</tspan></text><rect x="164" y="40" width="70" height="64" rx="7" fill="#FDE7DF" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11.5" font-weight="700" fill="#1C1C2E" text-anchor="middle"><tspan x="199" y="67">Como</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="10" font-weight="400" fill="#1C1C2E" text-anchor="middle"><tspan x="199" y="84">meio</tspan></text><rect x="240" y="40" width="70" height="64" rx="7" fill="#DCEBFA" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11.5" font-weight="700" fill="#1C1C2E" text-anchor="middle"><tspan x="275" y="67">Para quê</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="10" font-weight="400" fill="#1C1C2E" text-anchor="middle"><tspan x="275" y="84">finalidade</tspan></text><rect x="316" y="40" width="70" height="64" rx="7" fill="#DDF3E7" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11.5" font-weight="700" fill="#1C1C2E" text-anchor="middle"><tspan x="351" y="67">Detalhe</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="10" font-weight="400" fill="#1C1C2E" text-anchor="middle"><tspan x="351" y="84">a mais</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" font-weight="600" fill="#1C1C2E" text-anchor="middle"><tspan x="200" y="26">uma proposta completa tem as cinco</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="10.5" font-weight="400" fill="#1C1C2E" fill-opacity="0.8" text-anchor="middle"><tspan x="200" y="130">faltou uma, a proposta fica vaga</tspan></text></svg>