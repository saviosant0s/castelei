<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img" aria-label="Cinco blocos empilhados: título; introdução, que termina com a tese; primeiro argumento; segundo argumento; conclusão, que retoma a tese. Uma linha tracejada liga a tese da introdução à retomada na conclusão."><title>Cinco blocos empilhados: título; introdução, que termina com a tese; primeiro argumento; segundo argumento; conclusão, que retoma a tese. Uma linha tracejada liga a tese da introdução à retomada na conclusão.</title><rect x="40" y="14" width="260" height="30" rx="7" fill="#FFFFFF" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" font-weight="600" fill="#1C1C2E" text-anchor="middle"><tspan x="170" y="33">Título: curto, com uma pista da posição</tspan></text><rect x="40" y="56" width="260" height="44" rx="7" fill="#DCEBFA" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="700" fill="#1C1C2E" text-anchor="middle"><tspan x="170" y="75">Introdução</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="10.5" font-weight="400" fill="#1C1C2E" text-anchor="middle"><tspan x="170" y="90">apresenta o tema e termina na tese</tspan></text><rect x="40" y="112" width="260" height="44" rx="7" fill="#DDF3E7" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="700" fill="#1C1C2E" text-anchor="middle"><tspan x="170" y="131">Argumento 1</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="10.5" font-weight="400" fill="#1C1C2E" text-anchor="middle"><tspan x="170" y="146">uma razão por parágrafo</tspan></text><rect x="40" y="168" width="260" height="44" rx="7" fill="#DDF3E7" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="700" fill="#1C1C2E" text-anchor="middle"><tspan x="170" y="187">Argumento 2</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="10.5" font-weight="400" fill="#1C1C2E" text-anchor="middle"><tspan x="170" y="202">outra razão, diferente da primeira</tspan></text><rect x="40" y="224" width="260" height="44" rx="7" fill="#FDE7DF" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="700" fill="#1C1C2E" text-anchor="middle"><tspan x="170" y="243">Conclusão</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="10.5" font-weight="400" fill="#1C1C2E" text-anchor="middle"><tspan x="170" y="258">retoma a tese e fecha</tspan></text><path d="M 300 78.0 C 340 78.0, 340 246.0, 300 246.0" fill="none" stroke="#1C1C2E" stroke-width="1.4" stroke-dasharray="5 4" stroke-linecap="round" stroke-linejoin="round"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="10" font-weight="600" fill="#1C1C2E" text-anchor="middle"><tspan x="366" y="170.0">a mesma</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="10" font-weight="600" fill="#1C1C2E" text-anchor="middle"><tspan x="366" y="183.0">tese</tspan></text></svg>