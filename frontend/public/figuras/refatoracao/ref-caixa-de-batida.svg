<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 215" width="400" height="215" role="img" aria-label="Um personagem desenhado com capa e chapéu largos e, por dentro dele, um retângulo tracejado menor que marca a caixa de batida, cobrindo só o corpo."><title>Um personagem desenhado com capa e chapéu largos e, por dentro dele, um retângulo tracejado menor que marca a caixa de batida, cobrindo só o corpo.</title><path d="M 138 78 L 98 185 L 202 185 L 162 78 Z" fill="#FDE7DF" stroke="#1C1C2E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="130" y="95" width="40" height="80" rx="10" fill="#DCEBFA" stroke="#1C1C2E" stroke-width="1.6"/><circle cx="150" cy="78" r="16" fill="#FFE9D6" stroke="#1C1C2E" stroke-width="1.6"/><path d="M 110 64 L 190 64 L 172 58 L 164 26 L 136 26 L 128 58 Z" fill="#1C1C2E" stroke="#1C1C2E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="126" y="60" width="48" height="120" rx="3" fill="none" stroke="#52B788" stroke-width="1.8" stroke-dasharray="5 4"/><path d="M 180 38 L 255 38" fill="none" stroke="#1C1C2E" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="10.5" font-weight="600" fill="#1C1C2E" text-anchor="start"><tspan x="260" y="36">o desenho: capa</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="10.5" font-weight="600" fill="#1C1C2E" text-anchor="start"><tspan x="260" y="50">e chapéu largos</tspan></text><path d="M 176 130 L 255 130" fill="none" stroke="#52B788" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="10.5" font-weight="600" fill="#1C1C2E" text-anchor="start"><tspan x="260" y="128">a caixa de batida:</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="10.5" font-weight="600" fill="#1C1C2E" text