<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img" aria-label="Uma corrente de confiança em três elos: a raiz que o navegador já confia, o intermediário assinado por ela e o certificado do site assinado pelo intermediário"><title>Uma corrente de confiança em três elos: a raiz que o navegador já confia, o intermediário assinado por ela e o certificado do site assinado pelo intermediário</title><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1C1C2E"/></marker></defs><rect x="90" y="16" width="220" height="50" rx="10" fill="#DDF3E7" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" fill="#1C1C2E" text-anchor="middle" dominant-baseline="central"><tspan x="200" y="36.5" font-size="13">A raiz</tspan><tspan x="200" y="53.5" font-size="11">já vem dentro do navegador</tspan></text><line x1="200" y1="66" x2="200" y2="88" stroke="#1C1C2E" stroke-width="1.6" marker-end="url(#a)"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="10.5" fill="#1C1C2E" text-anchor="start" font-weight="normal"><tspan x="250" y="82">assina</tspan></text><rect x="90" y="90" width="220" height="50" rx="10" fill="#DCEBFA" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" fill="#1C1C2E" text-anchor="middle" dominant-baseline="central"><tspan x="200" y="110.5" font-size="13">O intermediário</tspan><tspan x="200" y="127.5" font-size="11">quem emite no dia a dia</tspan></text><line x1="200" y1="140" x2="200" y2="162" stroke="#1C1C2E" stroke-width="1.6" marker-end="url(#a)"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="10.5" fill="#1C1C2E" text-anchor="start" font-weight="normal"><tspan x="250" y="156">assina</tspan></text><rect x="90" y="164" width="220" height="50" rx="10" fill="#FDE7DF" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" fill="#1C1C2E" text-anchor="middle" dominant-baseline="central"><tspan x="200" y="184.5" font-size="13">O do seu site</tspan><tspan x="200" y="201.5" font-size="11">vale 90 dias, e renova sozinho</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11.5" fill="#1C1C2E" text-anchor="middle" font-weight="normal"><tspan x="200" y="240">O cadeado só acende se a corrente inteira fechar.</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11.5" fill="#1C1C2E" text-anchor="middle" font-weight="bold"><tspan x="200" y="272">Faltou um elo do meio? Uns abrem, outros não.</tspan></text></svg>