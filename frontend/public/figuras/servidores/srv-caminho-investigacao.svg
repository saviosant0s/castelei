<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img" aria-label="Cinco pontos do caminho de um pedido usados como etapas de investigação, com a orientação de cortar o caminho pela metade em vez de testar um por um"><title>Cinco pontos do caminho de um pedido usados como etapas de investigação, com a orientação de cortar o caminho pela metade em vez de testar um por um</title><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1C1C2E"/></marker></defs><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12.5" fill="#1C1C2E" text-anchor="middle" font-weight="bold"><tspan x="200" y="22">Corte pela metade, não teste um por um</tspan></text><rect x="14" y="40" width="110" height="46" rx="10" fill="#DCEBFA" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" fill="#1C1C2E" text-anchor="middle" dominant-baseline="central"><tspan x="69" y="58.5" font-size="12">1. O nome</tspan><tspan x="69" y="75.5" font-size="11">vira número?</tspan></text><rect x="145" y="40" width="110" height="46" rx="10" fill="#DCEBFA" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" fill="#1C1C2E" text-anchor="middle" dominant-baseline="central"><tspan x="200" y="58.5" font-size="12">2. A máquina</tspan><tspan x="200" y="75.5" font-size="11">responde?</tspan></text><rect x="276" y="40" width="110" height="46" rx="10" fill="#DCEBFA" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" fill="#1C1C2E" text-anchor="middle" dominant-baseline="central"><tspan x="331" y="58.5" font-size="12">3. A porta</tspan><tspan x="331" y="75.5" font-size="11">aceita?</tspan></text><rect x="80" y="104" width="110" height="46" rx="10" fill="#DDF3E7" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" fill="#1C1C2E" text-anchor="middle" dominant-baseline="central"><tspan x="135" y="122.5" font-size="12">4. O programa</tspan><tspan x="135" y="139.5" font-size="11">está escutando?</tspan></text><rect x="210" y="104" width="110" height="46" rx="10" fill="#DDF3E7" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" fill="#1C1C2E" text-anchor="middle" dominant-baseline="central"><tspan x="265" y="122.5" font-size="12">5. O banco</tspan><tspan x="265" y="139.5" font-size="11">responde?</tspan></text><rect x="40" y="170" width="320" height="46" rx="10" fill="#EEF1F5" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12.5" fill="#1C1C2E" text-anchor="middle" dominant-baseline="central"><tspan x="200" y="197" font-size="12.0">Comece pelo 3. Passou? O erro está depois dele.</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11.5" fill="#1C1C2E" text-anchor="middle" font-weight="normal"><tspan x="200" y="244">Cinco pontos testados um a um dão cinco rodadas.</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11.5" fill="#1C1C2E" text-anchor="middle" font-weight="normal"><tspan x="200" y="260">Cortando ao meio, dão três.</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11.5" fill="#1C1C2E" text-anchor="middle" font-weight="bold"><tspan x="200" y="288">Mude uma coisa de cada vez, ou não saberá o que funcionou.</tspan></text></svg>