<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img" aria-label="Os quatro sinais que dizem a saúde de um sistema: quanto tempo cada resposta leva, quantos pedidos chegam, quantos falham e o quanto a máquina está no limite"><title>Os quatro sinais que dizem a saúde de um sistema: quanto tempo cada resposta leva, quantos pedidos chegam, quantos falham e o quanto a máquina está no limite</title><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1C1C2E"/></marker></defs><rect x="14" y="24" width="180" height="74" rx="10" fill="#DCEBFA" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" fill="#1C1C2E" text-anchor="middle" dominant-baseline="central"><tspan x="104" y="48" font-size="13">Demora</tspan><tspan x="104" y="65" font-size="11">quanto tempo</tspan><tspan x="104" y="82" font-size="11">cada resposta leva</tspan></text><rect x="206" y="24" width="180" height="74" rx="10" fill="#DDF3E7" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" fill="#1C1C2E" text-anchor="middle" dominant-baseline="central"><tspan x="296" y="48" font-size="13">Movimento</tspan><tspan x="296" y="65" font-size="11">quantos pedidos</tspan><tspan x="296" y="82" font-size="11">chegam por segundo</tspan></text><rect x="14" y="110" width="180" height="74" rx="10" fill="#FDE7DF" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" fill="#1C1C2E" text-anchor="middle" dominant-baseline="central"><tspan x="104" y="134" font-size="13">Erro</tspan><tspan x="104" y="151" font-size="11">quantos pedidos</tspan><tspan x="104" y="168" font-size="11">terminam mal</tspan></text><rect x="206" y="110" width="180" height="74" rx="10" fill="#EEF1F5" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" fill="#1C1C2E" text-anchor="middle" dominant-baseline="central"><tspan x="296" y="134" font-size="13">Limite</tspan><tspan x="296" y="151" font-size="11">o quanto a máquina</tspan><tspan x="296" y="168" font-size="11">está no talo</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11.5" fill="#1C1C2E" text-anchor="middle" font-weight="normal"><tspan x="200" y="214">Estes quatro respondem quase toda pergunta de saúde.</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11.5" fill="#1C1C2E" text-anchor="middle" font-weight="normal"><tspan x="200" y="240">Olhe a demora da pior fatia, nunca a média:</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11.5" fill="#1C1C2E" text-anchor="middle" font-weight="normal"><tspan x="200" y="256">a média esconde a minoria que está sofrendo.</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11.5" fill="#1C1C2E" text-anchor="middle" font-weight="bold"><tspan x="200" y="286">Alarme sem ação definida vira ruído e é ignorado.</tspan></text></svg>