<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img" aria-label="Um programa na frente recebe todas as conexões da internet e repassa para as aplicações que rodam escondidas dentro da máquina, sem que elas sejam alcançadas diretamente"><title>Um programa na frente recebe todas as conexões da internet e repassa para as aplicações que rodam escondidas dentro da máquina, sem que elas sejam alcançadas diretamente</title><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1C1C2E"/></marker></defs><rect x="14" y="92" width="84" height="56" rx="10" fill="#EEF1F5" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" fill="#1C1C2E" text-anchor="middle" dominant-baseline="central"><tspan x="56" y="115.5" font-size="12.5">A internet</tspan><tspan x="56" y="132.5" font-size="11">bate aqui</tspan></text><line x1="98" y1="120" x2="126" y2="120" stroke="#1C1C2E" stroke-width="1.6" marker-end="url(#a)"/><rect x="128" y="60" width="104" height="120" rx="10" fill="#DCEBFA" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12.5" fill="#1C1C2E" text-anchor="middle" dominant-baseline="central"><tspan x="180" y="90" font-size="12.5">O porteiro</tspan><tspan x="180" y="107" font-size="11"></tspan><tspan x="180" y="124" font-size="11">recebe tudo</tspan><tspan x="180" y="141" font-size="11">e decide</tspan><tspan x="180" y="158" font-size="11">para onde vai</tspan></text><line x1="232" y1="92" x2="268" y2="92" stroke="#1C1C2E" stroke-width="1.6" marker-end="url(#a)"/><line x1="232" y1="148" x2="268" y2="148" stroke="#1C1C2E" stroke-width="1.6" marker-end="url(#a)"/><rect x="270" y="66" width="116" height="52" rx="10" fill="#DDF3E7" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" fill="#1C1C2E" text-anchor="middle" dominant-baseline="central"><tspan x="328" y="87.5" font-size="12">Aplicação A</tspan><tspan x="328" y="104.5" font-size="11">porta 3000</tspan></text><rect x="270" y="124" width="116" height="52" rx="10" fill="#FDE7DF" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" fill="#1C1C2E" text-anchor="middle" dominant-baseline="central"><tspan x="328" y="145.5" font-size="12">Aplicação B</tspan><tspan x="328" y="162.5" font-size="11">porta 4000</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11.5" fill="#1C1C2E" text-anchor="middle" font-weight="normal"><tspan x="200" y="208">Só o porteiro fica exposto. As aplicações não.</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11.5" fill="#1C1C2E" text-anchor="middle" font-weight="normal"><tspan x="200" y="234">Ele também guarda o cadeado e o que é estático.</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11.5" fill="#1C1C2E" text-anchor="middle" font-weight="bold"><tspan x="200" y="272">Uma máquina, vários sites, um endereço só.</tspan></text></svg>