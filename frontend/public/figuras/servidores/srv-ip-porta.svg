<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img" aria-label="Um prédio representa o endereço numérico da máquina e cada apartamento representa uma porta, com três programas diferentes atendendo em portas diferentes na mesma máquina"><title>Um prédio representa o endereço numérico da máquina e cada apartamento representa uma porta, com três programas diferentes atendendo em portas diferentes na mesma máquina</title><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1C1C2E"/></marker></defs><rect x="100" y="10" width="200" height="44" rx="10" fill="#EEF1F5" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" fill="#1C1C2E" text-anchor="middle" dominant-baseline="central"><tspan x="200" y="27.5" font-size="13">203.0.113.10</tspan><tspan x="200" y="44.5" font-size="11">o endereço da máquina</tspan></text><line x1="200" y1="54" x2="200" y2="68" stroke="#1C1C2E" stroke-width="1.6" marker-end="url(#a)"/><rect x="40" y="70" width="320" height="128" rx="12" fill="#FFFFFF" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" fill="#1C1C2E" text-anchor="middle" dominant-baseline="central"><tspan x="200" y="138" font-size="13"></tspan></text><rect x="56" y="86" width="88" height="44" rx="10" fill="#DCEBFA" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" fill="#1C1C2E" text-anchor="middle" dominant-baseline="central"><tspan x="100" y="103.5" font-size="12">porta 22</tspan><tspan x="100" y="120.5" font-size="10.0">acesso remoto</tspan></text><rect x="156" y="86" width="88" height="44" rx="10" fill="#DDF3E7" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" fill="#1C1C2E" text-anchor="middle" dominant-baseline="central"><tspan x="200" y="103.5" font-size="12">porta 80</tspan><tspan x="200" y="120.5" font-size="8.0">site sem cadeado</tspan></text><rect x="256" y="86" width="88" height="44" rx="10" fill="#FDE7DF" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" fill="#1C1C2E" text-anchor="middle" dominant-baseline="central"><tspan x="300" y="103.5" font-size="12">porta 443</tspan><tspan x="300" y="120.5" font-size="8.0">site com cadeado</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11.5" fill="#1C1C2E" text-anchor="middle" font-weight="normal"><tspan x="200" y="156">Uma máquina só, vários programas atendendo.</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11.5" fill="#1C1C2E" text-anchor="middle" font-weight="normal"><tspan x="200" y="176">O número da porta diz qual deles recebe o pedido.</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11.5" fill="#1C1C2E" text-anchor="middle" font-weight="bold"><tspan x="200" y="226">O endereço é o prédio. A porta é o apartamento.</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11.5" fill="#1C1C2E" text-anchor="middle" font-weight="normal"><tspan x="200" y="258">Bateu no prédio certo e no apartamento errado?</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11.5" fill="#1C1C2E" text-anchor="middle" font-weight="normal"><tspan x="200" y="274">Ninguém atende, e a conexão morre esperando.</tspan></text></svg>