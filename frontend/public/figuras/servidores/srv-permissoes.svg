<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img" aria-label="As nove letras de permissão de um arquivo divididas em três grupos de três: dono, grupo e todos os outros, cada grupo com direito de ler, gravar e executar"><title>As nove letras de permissão de um arquivo divididas em três grupos de três: dono, grupo e todos os outros, cada grupo com direito de ler, gravar e executar</title><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1C1C2E"/></marker></defs><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="22" fill="#1C1C2E" text-anchor="middle" font-weight="bold"><tspan x="200" y="26">- rwx r-x r--</tspan></text><rect x="20" y="48" width="110" height="60" rx="10" fill="#DDF3E7" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="14" fill="#1C1C2E" text-anchor="middle" dominant-baseline="central"><tspan x="75" y="65" font-size="14">rwx</tspan><tspan x="75" y="82" font-size="11">o dono</tspan><tspan x="75" y="99" font-size="9.0">lê, grava e executa</tspan></text><rect x="145" y="48" width="110" height="60" rx="10" fill="#DCEBFA" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="14" fill="#1C1C2E" text-anchor="middle" dominant-baseline="central"><tspan x="200" y="65" font-size="14">r-x</tspan><tspan x="200" y="82" font-size="11">o grupo</tspan><tspan x="200" y="99" font-size="11">lê e executa</tspan></text><rect x="270" y="48" width="110" height="60" rx="10" fill="#FDE7DF" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="14" fill="#1C1C2E" text-anchor="middle" dominant-baseline="central"><tspan x="325" y="65" font-size="14">r--</tspan><tspan x="325" y="82" font-size="11">todo o resto</tspan><tspan x="325" y="99" font-size="11">só lê</tspan></text><rect x="50" y="130" width="300" height="76" rx="10" fill="#EEF1F5" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" fill="#1C1C2E" text-anchor="middle" dominant-baseline="central"><tspan x="200" y="155" font-size="12">r = ler o conteúdo</tspan><tspan x="200" y="172" font-size="11">w = gravar por cima</tspan><tspan x="200" y="189" font-size="11">x = executar, ou entrar na pasta</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11.5" fill="#1C1C2E" text-anchor="middle" font-weight="normal"><tspan x="200" y="238">Em pasta, o x não executa nada: ele deixa entrar.</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11.5" fill="#1C1C2E" text-anchor="middle" font-weight="bold"><tspan x="200" y="272">777 abre para todo mundo. Nunca é a solução.</tspan></text></svg>