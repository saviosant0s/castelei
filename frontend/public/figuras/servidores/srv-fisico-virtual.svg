<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img" aria-label="Um computador de verdade dividido em três caixas menores e independentes, cada uma com sua fatia de processador e de memória e com seu próprio sistema"><title>Um computador de verdade dividido em três caixas menores e independentes, cada uma com sua fatia de processador e de memória e com seu próprio sistema</title><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1C1C2E"/></marker></defs><rect x="20" y="20" width="360" height="34" rx="10" fill="#EEF1F5" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" fill="#1C1C2E" text-anchor="middle" dominant-baseline="central"><tspan x="200" y="41" font-size="12">Um computador de verdade, num prédio de hospedagem</tspan></text><rect x="28" y="72" width="104" height="118" rx="10" fill="#DCEBFA" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" fill="#1C1C2E" text-anchor="middle" dominant-baseline="central"><tspan x="80" y="109.5" font-size="13">VPS 1</tspan><tspan x="80" y="126.5" font-size="11">1 processador</tspan><tspan x="80" y="143.5" font-size="11">2 GB de memória</tspan><tspan x="80" y="160.5" font-size="11">sistema próprio</tspan></text><rect x="148" y="72" width="104" height="118" rx="10" fill="#DDF3E7" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" fill="#1C1C2E" text-anchor="middle" dominant-baseline="central"><tspan x="200" y="109.5" font-size="13">VPS 2</tspan><tspan x="200" y="126.5" font-size="11">2 processadores</tspan><tspan x="200" y="143.5" font-size="11">4 GB de memória</tspan><tspan x="200" y="160.5" font-size="11">sistema próprio</tspan></text><rect x="268" y="72" width="104" height="118" rx="10" fill="#FDE7DF" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" fill="#1C1C2E" text-anchor="middle" dominant-baseline="central"><tspan x="320" y="109.5" font-size="13">VPS 3</tspan><tspan x="320" y="126.5" font-size="11">1 processador</tspan><tspan x="320" y="143.5" font-size="11">1 GB de memória</tspan><tspan x="320" y="160.5" font-size="11">sistema próprio</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11.5" fill="#1C1C2E" text-anchor="middle" font-weight="normal"><tspan x="200" y="218">Cada caixa recebe uma fatia e não enxerga as outras.</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11.5" fill="#1C1C2E" text-anchor="middle" font-weight="bold"><tspan x="200" y="252">Reiniciar a VPS 2 não desliga a 1 nem a 3.</tspan></text></svg>