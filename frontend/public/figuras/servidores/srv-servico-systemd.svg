<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img" aria-label="Duas perguntas independentes sobre um serviço: se ele está rodando agora e se ele volta sozinho quando a máquina reinicia, formando quatro combinações possíveis"><title>Duas perguntas independentes sobre um serviço: se ele está rodando agora e se ele volta sozinho quando a máquina reinicia, formando quatro combinações possíveis</title><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1C1C2E"/></marker></defs><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11.5" fill="#1C1C2E" text-anchor="middle" font-weight="bold"><tspan x="200" y="24">Duas perguntas diferentes, e as duas precisam de sim</tspan></text><rect x="30" y="44" width="160" height="34" rx="10" fill="#EEF1F5" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12.5" fill="#1C1C2E" text-anchor="middle" dominant-baseline="central"><tspan x="110" y="65" font-size="12.5">Está rodando agora?</tspan></text><rect x="210" y="44" width="160" height="34" rx="10" fill="#EEF1F5" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12.5" fill="#1C1C2E" text-anchor="middle" dominant-baseline="central"><tspan x="290" y="65" font-size="12.0">Volta sozinho no boot?</tspan></text><rect x="30" y="96" width="160" height="54" rx="10" fill="#DDF3E7" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" fill="#1C1C2E" text-anchor="middle" dominant-baseline="central"><tspan x="110" y="118.5" font-size="13">sim + sim</tspan><tspan x="110" y="135.5" font-size="11">é isto que você quer</tspan></text><rect x="210" y="96" width="160" height="54" rx="10" fill="#FDE7DF" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" fill="#1C1C2E" text-anchor="middle" dominant-baseline="central"><tspan x="290" y="118.5" font-size="13">sim + não</tspan><tspan x="290" y="135.5" font-size="11">cai no próximo reinício</tspan></text><rect x="30" y="162" width="160" height="54" rx="10" fill="#DCEBFA" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" fill="#1C1C2E" text-anchor="middle" dominant-baseline="central"><tspan x="110" y="184.5" font-size="13">não + sim</tspan><tspan x="110" y="201.5" font-size="11">só falta ligar agora</tspan></text><rect x="210" y="162" width="160" height="54" rx="10" fill="#EEF1F5" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" fill="#1C1C2E" text-anchor="middle" dominant-baseline="central"><tspan x="290" y="184.5" font-size="13">não + não</tspan><tspan x="290" y="201.5" font-size="11">está desligado mesmo</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11.5" fill="#1C1C2E" text-anchor="middle" font-weight="normal"><tspan x="200" y="244">start liga agora. enable faz voltar sozinho.</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11.5" fill="#1C1C2E" text-anchor="middle" font-weight="bold"><tspan x="200" y="274">Serviço que some depois de reiniciar esqueceu o enable.</tspan></text></svg>