"331" y1="96" x2="331" y2="128" stroke="#1C1C2E" stroke-width="1.6" marker-end="url(#a)"/><rect x="276" y="130" width="110" height="52" rx="10" fill="#FDE7DF" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" fill="#1C1C2E" text-anchor="middle" dominant-baseline="central"><tspan x="331" y="151.5" font-size="13">Os dados</tspan><tspan x="331" y="168.5" font-size="11">no disco</tspan></text><path d="M331 182 L331 214 L69 214 L69 100" fill="none" stroke="#1C1C2E" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#a)"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11.5" fill="#1C1C2E" text-anchor="middle" font-weight="normal"><tspan x="200" y="238">a resposta volta pelo mesmo caminho</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11.5" fill="#1C1C2E" text-anchor="middle" font-weight="bold"><tspan x="200" y="274">Quando algo falha, a pergunta é: em qual caixa?</tspan></text></svg>