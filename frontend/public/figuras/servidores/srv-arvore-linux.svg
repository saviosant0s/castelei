<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img" aria-label="Árvore de pastas do Linux partindo de uma barra no topo, com quatro ramos: etc para configuração, var para arquivos que crescem, home para as pastas das pessoas e usr para os programas"><title>Árvore de pastas do Linux partindo de uma barra no topo, com quatro ramos: etc para configuração, var para arquivos que crescem, home para as pastas das pessoas e usr para os programas</title><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1C1C2E"/></marker></defs><rect x="160" y="16" width="80" height="40" rx="10" fill="#EEF1F5" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" fill="#1C1C2E" text-anchor="middle" dominant-baseline="central"><tspan x="200" y="31.5" font-size="13">/</tspan><tspan x="200" y="48.5" font-size="11">a raiz</tspan></text><line x1="200" y1="56" x2="60" y2="92" stroke="#1C1C2E" stroke-width="1.6" marker-end="url(#a)"/><line x1="200" y1="56" x2="150" y2="92" stroke="#1C1C2E" stroke-width="1.6" marker-end="url(#a)"/><line x1="200" y1="56" x2="250" y2="92" stroke="#1C1C2E" stroke-width="1.6" marker-end="url(#a)"/><line x1="200" y1="56" x2="340" y2="92" stroke="#1C1C2E" stroke-width="1.6" marker-end="url(#a)"/><rect x="14" y="94" width="92" height="68" rx="10" fill="#DCEBFA" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" fill="#1C1C2E" text-anchor="middle" dominant-baseline="central"><tspan x="60" y="115" font-size="13">/etc</tspan><tspan x="60" y="132" font-size="11">configuração</tspan><tspan x="60" y="149" font-size="11">dos programas</tspan></text><rect x="108" y="94" width="92" height="68" rx="10" fill="#DDF3E7" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" fill="#1C1C2E" text-anchor="middle" dominant-baseline="central"><tspan x="154" y="115" font-size="13">/var</tspan><tspan x="154" y="132" font-size="11">o que cresce:</tspan><tspan x="154" y="149" font-size="8.0">registros e filas</tspan></text><rect x="212" y="94" width="92" height="68" rx="10" fill="#FDE7DF" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" fill="#1C1C2E" text-anchor="middle" dominant-baseline="central"><tspan x="258" y="115" font-size="13">/home</tspan><tspan x="258" y="132" font-size="11">as pastas</tspan><tspan x="258" y="149" font-size="11">das pessoas</tspan></text><rect x="306" y="94" width="80" height="68" rx="10" fill="#EEF1F5" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" fill="#1C1C2E" text-anchor="middle" dominant-baseline="central"><tspan x="346" y="115" font-size="13">/usr</tspan><tspan x="346" y="132" font-size="10.5">os próprios</tspan><tspan x="346" y="149" font-size="11">programas</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11.5" fill="#1C1C2E" text-anchor="middle" font-weight="normal"><tspan x="200" y="196">Não existem letras de unidade como C: ou D: aqui.</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11.5" fill="#1C1C2E" text-anchor="middle" font-weight="normal"><tspan x="200" y="222">Todo disco novo é pendurado em algum ponto da mesma árvore.</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11.5" fill="#1C1C2E" text-anchor="middle" font-weight="bold"><tspan x="200" y="260">Mexeu em /etc? É configuração. Encheu o disco? Olhe /var.</tspan></text></svg>