<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img" aria-label="Duas caixas lado a lado: no seu computador fica a chave privada, que nunca sai dali, e no servidor fica a chave pública, com uma seta mostrando que só a cópia pública viaja"><title>Duas caixas lado a lado: no seu computador fica a chave privada, que nunca sai dali, e no servidor fica a chave pública, com uma seta mostrando que só a cópia pública viaja</title><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1C1C2E"/></marker></defs><rect x="14" y="30" width="160" height="92" rx="10" fill="#DCEBFA" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" fill="#1C1C2E" text-anchor="middle" dominant-baseline="central"><tspan x="94" y="54.5" font-size="13">Seu computador</tspan><tspan x="94" y="71.5" font-size="11">guarda a CHAVE PRIVADA</tspan><tspan x="94" y="88.5" font-size="11">ela nunca sai daqui</tspan><tspan x="94" y="105.5" font-size="11">é o seu segredo</tspan></text><rect x="226" y="30" width="160" height="92" rx="10" fill="#DDF3E7" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" fill="#1C1C2E" text-anchor="middle" dominant-baseline="central"><tspan x="306" y="54.5" font-size="13">O servidor</tspan><tspan x="306" y="71.5" font-size="11">guarda a CHAVE PÚBLICA</tspan><tspan x="306" y="88.5" font-size="11">pode ser vista por todos</tspan><tspan x="306" y="105.5" font-size="11">é só a fechadura</tspan></text><line x1="176" y1="60" x2="222" y2="60" stroke="#1C1C2E" stroke-width="1.6" marker-end="url(#a)"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" fill="#1C1C2E" text-anchor="middle" font-weight="normal"><tspan x="200" y="146">só a cópia pública viaja</tspan></text><rect x="60" y="176" width="280" height="46" rx="10" fill="#EEF1F5" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11.5" fill="#1C1C2E" text-anchor="middle" dominant-baseline="central"><tspan x="200" y="203" font-size="8.0">O servidor propõe um desafio que só a chave privada resolve.</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11.5" fill="#1C1C2E" text-anchor="middle" font-weight="normal"><tspan x="200" y="250">Ninguém digita senha, e o segredo nunca atravessa a internet.</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11.5" fill="#1C1C2E" text-anchor="middle" font-weight="bold"><tspan x="200" y="280">Perdeu a chave privada? Ninguém a recupera para você.</tspan></text></svg>