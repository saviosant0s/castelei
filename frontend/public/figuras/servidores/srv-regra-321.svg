<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img" aria-label="A regra de três cópias em dois tipos de lugar com uma delas fora do prédio, e o teste de restauração que transforma arquivo em garantia"><title>A regra de três cópias em dois tipos de lugar com uma delas fora do prédio, e o teste de restauração que transforma arquivo em garantia</title><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1C1C2E"/></marker></defs><rect x="130" y="14" width="140" height="42" rx="10" fill="#DCEBFA" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" fill="#1C1C2E" text-anchor="middle" dominant-baseline="central"><tspan x="200" y="30.5" font-size="13">3 cópias</tspan><tspan x="200" y="47.5" font-size="11">dos mesmos dados</tspan></text><line x1="200" y1="56" x2="200" y2="76" stroke="#1C1C2E" stroke-width="1.6" marker-end="url(#a)"/><rect x="50" y="78" width="140" height="52" rx="10" fill="#DDF3E7" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" fill="#1C1C2E" text-anchor="middle" dominant-baseline="central"><tspan x="120" y="99.5" font-size="13">2 lugares</tspan><tspan x="120" y="116.5" font-size="11">de tipos diferentes</tspan></text><rect x="210" y="78" width="140" height="52" rx="10" fill="#FDE7DF" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" fill="#1C1C2E" text-anchor="middle" dominant-baseline="central"><tspan x="280" y="99.5" font-size="13">1 fora</tspan><tspan x="280" y="116.5" font-size="11">de outro prédio</tspan></text><rect x="60" y="156" width="280" height="48" rx="10" fill="#EEF1F5" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" fill="#1C1C2E" text-anchor="middle" dominant-baseline="central"><tspan x="200" y="184" font-size="13">E uma restauração já feita de verdade</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11.5" fill="#1C1C2E" text-anchor="middle" font-weight="normal"><tspan x="200" y="236">Cópia guardada no mesmo disco morre junto com ele.</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11.5" fill="#1C1C2E" text-anchor="middle" font-weight="normal"><tspan x="200" y="262">Cópia nunca restaurada é um arquivo, não uma garantia.</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11.5" fill="#1C1C2E" text-anchor="middle" font-weight="bold"><tspan x="200" y="290">O teste é a parte que quase todo mundo pula.</tspan></text></svg>