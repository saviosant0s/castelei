<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img" aria-label="Uma portaria filtrando quatro tentativas de entrada: três portas liberadas passam e uma porta fechada é barrada antes de chegar ao servidor"><title>Uma portaria filtrando quatro tentativas de entrada: três portas liberadas passam e uma porta fechada é barrada antes de chegar ao servidor</title><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1C1C2E"/></marker></defs><rect x="14" y="20" width="92" height="210" rx="10" fill="#EEF1F5" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" fill="#1C1C2E" text-anchor="middle" dominant-baseline="central"><tspan x="60" y="103.5" font-size="12">Quem</tspan><tspan x="60" y="120.5" font-size="11">bate</tspan><tspan x="60" y="137.5" font-size="11">na sua</tspan><tspan x="60" y="154.5" font-size="11">máquina</tspan></text><rect x="158" y="14" width="86" height="216" rx="10" fill="#DCEBFA" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12.5" fill="#1C1C2E" text-anchor="middle" dominant-baseline="central"><tspan x="201" y="83.5" font-size="12.5">A portaria</tspan><tspan x="201" y="100.5" font-size="11"></tspan><tspan x="201" y="117.5" font-size="11">deixa passar</tspan><tspan x="201" y="134.5" font-size="11">só o que</tspan><tspan x="201" y="151.5" font-size="11">está na</tspan><tspan x="201" y="168.5" font-size="11">lista</tspan></text><rect x="296" y="14" width="90" height="60" rx="10" fill="#DDF3E7" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" fill="#1C1C2E" text-anchor="middle" dominant-baseline="central"><tspan x="341" y="39.5" font-size="12">porta 22</tspan><tspan x="341" y="56.5" font-size="11">liberada</tspan></text><rect x="296" y="84" width="90" height="60" rx="10" fill="#DDF3E7" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" fill="#1C1C2E" text-anchor="middle" dominant-baseline="central"><tspan x="341" y="109.5" font-size="12">porta 443</tspan><tspan x="341" y="126.5" font-size="11">liberada</tspan></text><rect x="296" y="154" width="90" height="60" rx="10" fill="#FDE7DF" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" fill="#1C1C2E" text-anchor="middle" dominant-baseline="central"><tspan x="341" y="179.5" font-size="12">porta 5432</tspan><tspan x="341" y="196.5" font-size="11">fechada</tspan></text><line x1="106" y1="44" x2="154" y2="44" stroke="#1C1C2E" stroke-width="1.6" marker-end="url(#a)"/><line x1="106" y1="114" x2="154" y2="114" stroke="#1C1C2E" stroke-width="1.6" marker-end="url(#a)"/><line x1="106" y1="184" x2="154" y2="184" stroke="#1C1C2E" stroke-width="1.6" marker-end="url(#a)"/><line x1="244" y1="44" x2="292" y2="44" stroke="#1C1C2E" stroke-width="1.6" marker-end="url(#a)"/><line x1="244" y1="114" x2="292" y2="114" stroke="#1C1C2E" stroke-width="1.6" marker-end="url(#a)"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="20" fill="#1C1C2E" text-anchor="middle" font-weight="bold"><tspan x="268" y="190">✕</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11.5" fill="#1C1C2E" text-anchor="middle" font-weight="normal"><tspan x="200" y="258">O que não está na lista nem chega ao programa.</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11.5" fill="#1C1C2E" text-anchor="middle" font-weight="bold"><tspan x="200" y="282">Banco de dados aberto para a internet é convite.</tspan></text></svg>