<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img" aria-label="Quatro recursos de uma máquina em fila, com o mais estreito deles determinando a velocidade de todo o conjunto, como o trecho mais fino de um cano"><title>Quatro recursos de uma máquina em fila, com o mais estreito deles determinando a velocidade de todo o conjunto, como o trecho mais fino de um cano</title><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1C1C2E"/></marker></defs><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" fill="#1C1C2E" text-anchor="middle" font-weight="bold"><tspan x="200" y="22">A fila inteira anda na velocidade do trecho mais fino</tspan></text><rect x="14" y="42" width="88" height="64" rx="10" fill="#DDF3E7" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" fill="#1C1C2E" text-anchor="middle" dominant-baseline="central"><tspan x="58" y="69.5" font-size="12">Processador</tspan><tspan x="58" y="86.5" font-size="11">40% usado</tspan></text><rect x="110" y="42" width="88" height="64" rx="10" fill="#DDF3E7" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" fill="#1C1C2E" text-anchor="middle" dominant-baseline="central"><tspan x="154" y="69.5" font-size="12">Memória</tspan><tspan x="154" y="86.5" font-size="11">55% usada</tspan></text><rect x="206" y="42" width="88" height="64" rx="10" fill="#FDE7DF" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" fill="#1C1C2E" text-anchor="middle" dominant-baseline="central"><tspan x="250" y="69.5" font-size="12">Disco</tspan><tspan x="250" y="86.5" font-size="11">99% ocupado</tspan></text><rect x="302" y="42" width="84" height="64" rx="10" fill="#DDF3E7" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" fill="#1C1C2E" text-anchor="middle" dominant-baseline="central"><tspan x="344" y="69.5" font-size="12">Rede</tspan><tspan x="344" y="86.5" font-size="11">12% usada</tspan></text><line x1="58" y1="120" x2="58" y2="140" stroke="#1C1C2E" stroke-width="1.6" marker-end="url(#a)"/><line x1="154" y1="120" x2="154" y2="140" stroke="#1C1C2E" stroke-width="1.6" marker-end="url(#a)"/><line x1="250" y1="120" x2="250" y2="140" stroke="#1C1C2E" stroke-width="1.6" marker-end="url(#a)"/><line x1="344" y1="120" x2="344" y2="140" stroke="#1C1C2E" stroke-width="1.6" marker-end="url(#a)"/><rect x="60" y="144" width="280" height="42" rx="10" fill="#EEF1F5" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12.5" fill="#1C1C2E" text-anchor="middle" dominant-baseline="central"><tspan x="200" y="169" font-size="12.5">Aumentar processador aqui não muda nada</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11.5" fill="#1C1C2E" text-anchor="middle" font-weight="normal"><tspan x="200" y="216">Meça antes de comprar. O gargalo quase nunca é</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11.5" fill="#1C1C2E" text-anchor="middle" font-weight="normal"><tspan x="200" y="232">o que a intuição aponta primeiro.</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11.5" fill="#1C1C2E" text-anchor="middle" font-weight="bold"><tspan x="200" y="268">Resolveu um? O gargalo muda de lugar. Meça de novo.</tspan></text></svg>