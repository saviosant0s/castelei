<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img" aria-label="Uma esteira automática em quatro etapas que parte do envio do código, roda os testes, monta a versão e publica, parando em qualquer etapa que falhar"><title>Uma esteira automática em quatro etapas que parte do envio do código, roda os testes, monta a versão e publica, parando em qualquer etapa que falhar</title><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1C1C2E"/></marker></defs><rect x="14" y="40" width="84" height="54" rx="10" fill="#DCEBFA" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" fill="#1C1C2E" text-anchor="middle" dominant-baseline="central"><tspan x="56" y="62.5" font-size="12">1. Enviar</tspan><tspan x="56" y="79.5" font-size="11">o código</tspan></text><line x1="98" y1="66" x2="118" y2="66" stroke="#1C1C2E" stroke-width="1.6" marker-end="url(#a)"/><rect x="120" y="40" width="84" height="54" rx="10" fill="#DDF3E7" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" fill="#1C1C2E" text-anchor="middle" dominant-baseline="central"><tspan x="162" y="62.5" font-size="12">2. Testar</tspan><tspan x="162" y="79.5" font-size="11">automático</tspan></text><line x1="204" y1="66" x2="224" y2="66" stroke="#1C1C2E" stroke-width="1.6" marker-end="url(#a)"/><rect x="226" y="40" width="76" height="54" rx="10" fill="#DDF3E7" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" fill="#1C1C2E" text-anchor="middle" dominant-baseline="central"><tspan x="264" y="62.5" font-size="12">3. Montar</tspan><tspan x="264" y="79.5" font-size="11">a versão</tspan></text><line x1="302" y1="66" x2="322" y2="66" stroke="#1C1C2E" stroke-width="1.6" marker-end="url(#a)"/><rect x="324" y="40" width="62" height="54" rx="10" fill="#DDF3E7" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" fill="#1C1C2E" text-anchor="middle" dominant-baseline="central"><tspan x="355" y="71" font-size="10.5">4. Subir</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11.5" fill="#1C1C2E" text-anchor="middle" font-weight="normal"><tspan x="200" y="128">Falhou em alguma? A esteira para ali.</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11.5" fill="#1C1C2E" text-anchor="middle" font-weight="normal"><tspan x="200" y="146">Nada do que vem depois acontece.</tspan></text><rect x="50" y="172" width="300" height="44" rx="10" fill="#EEF1F5" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12.5" fill="#1C1C2E" text-anchor="middle" dominant-baseline="central"><tspan x="200" y="198" font-size="11.0">A máquina nunca esquece um passo. Você esquece.</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11.5" fill="#1C1C2E" text-anchor="middle" font-weight="normal"><tspan x="200" y="248">A esteira não deixa o código melhor.</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11.5" fill="#1C1C2E" text-anchor="middle" font-weight="normal"><tspan x="200" y="266">Ela impede que o pior chegue no ar.</tspan></text></svg>