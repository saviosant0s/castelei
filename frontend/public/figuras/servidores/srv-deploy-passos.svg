<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img" aria-label="Quatro passos de uma publicação: montar a versão nova, enviá-la para a máquina, apontar o atalho para ela e manter a anterior guardada para voltar atrás"><title>Quatro passos de uma publicação: montar a versão nova, enviá-la para a máquina, apontar o atalho para ela e manter a anterior guardada para voltar atrás</title><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1C1C2E"/></marker></defs><rect x="14" y="26" width="88" height="54" rx="10" fill="#DCEBFA" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" fill="#1C1C2E" text-anchor="middle" dominant-baseline="central"><tspan x="58" y="48.5" font-size="12">1. Montar</tspan><tspan x="58" y="65.5" font-size="10.0">a versão nova</tspan></text><line x1="102" y1="52" x2="124" y2="52" stroke="#1C1C2E" stroke-width="1.6" marker-end="url(#a)"/><rect x="126" y="26" width="88" height="54" rx="10" fill="#DCEBFA" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" fill="#1C1C2E" text-anchor="middle" dominant-baseline="central"><tspan x="170" y="48.5" font-size="12">2. Enviar</tspan><tspan x="170" y="65.5" font-size="9.5">para a máquina</tspan></text><line x1="214" y1="52" x2="236" y2="52" stroke="#1C1C2E" stroke-width="1.6" marker-end="url(#a)"/><rect x="238" y="26" width="88" height="54" rx="10" fill="#DDF3E7" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" fill="#1C1C2E" text-anchor="middle" dominant-baseline="central"><tspan x="282" y="48.5" font-size="12">3. Apontar</tspan><tspan x="282" y="65.5" font-size="11">o atalho</tspan></text><rect x="60" y="112" width="280" height="60" rx="10" fill="#EEF1F5" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11.5" fill="#1C1C2E" text-anchor="middle" dominant-baseline="central"><tspan x="200" y="129" font-size="11.5">versao-2026-09-22  &lt;- o atalho aponta aqui</tspan><tspan x="200" y="146" font-size="11">versao-2026-09-15  (guardada)</tspan><tspan x="200" y="163" font-size="11">versao-2026-09-08  (guardada)</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11.5" fill="#1C1C2E" text-anchor="middle" font-weight="normal"><tspan x="200" y="206">Voltar atrás é mover o atalho de volta. Leva segundos.</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11.5" fill="#1C1C2E" text-anchor="middle" font-weight="normal"><tspan x="200" y="240">A versão nova é montada antes de virar a atual,</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11.5" fill="#1C1C2E" text-anchor="middle" font-weight="normal"><tspan x="200" y="256">então ninguém vê o site pela metade.</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11.5" fill="#1C1C2E" text-anchor="middle" font-weight="bold"><tspan x="200" y="286">Sem volta ensaiada, não existe publicação segura.</tspan></text></svg>