<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img" aria-label="Comparação entre administrar a própria máquina e contratar serviço gerenciado, mostrando quantas camadas ficam sob responsabilidade de cada lado"><title>Comparação entre administrar a própria máquina e contratar serviço gerenciado, mostrando quantas camadas ficam sob responsabilidade de cada lado</title><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1C1C2E"/></marker></defs><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12.5" fill="#1C1C2E" text-anchor="middle" font-weight="bold"><tspan x="104" y="20">Máquina sua</tspan></text><rect x="14" y="30" width="180" height="30" rx="10" fill="#DCEBFA" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" fill="#1C1C2E" text-anchor="middle" dominant-baseline="central"><tspan x="104" y="49" font-size="12">Seu código</tspan></text><rect x="14" y="64" width="180" height="96" rx="10" fill="#FDE7DF" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" fill="#1C1C2E" text-anchor="middle" dominant-baseline="central"><tspan x="104" y="90.5" font-size="12">Banco, atualização,</tspan><tspan x="104" y="107.5" font-size="11">cópia, portaria,</tspan><tspan x="104" y="124.5" font-size="11">monitoramento</tspan><tspan x="104" y="141.5" font-size="11">— tudo seu</tspan></text><rect x="14" y="164" width="180" height="30" rx="10" fill="#EEF1F5" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" fill="#1C1C2E" text-anchor="middle" dominant-baseline="central"><tspan x="104" y="183" font-size="12">A máquina</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12.5" fill="#1C1C2E" text-anchor="middle" font-weight="bold"><tspan x="296" y="20">Serviço gerenciado</tspan></text><rect x="206" y="30" width="180" height="30" rx="10" fill="#DCEBFA" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" fill="#1C1C2E" text-anchor="middle" dominant-baseline="central"><tspan x="296" y="49" font-size="12">Seu código</tspan></text><rect x="206" y="64" width="180" height="96" rx="10" fill="#DDF3E7" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" fill="#1C1C2E" text-anchor="middle" dominant-baseline="central"><tspan x="296" y="90.5" font-size="12">Banco, atualização,</tspan><tspan x="296" y="107.5" font-size="11">cópia, portaria,</tspan><tspan x="296" y="124.5" font-size="11">monitoramento</tspan><tspan x="296" y="141.5" font-size="11">— deles</tspan></text><rect x="206" y="164" width="180" height="30" rx="10" fill="#EEF1F5" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" fill="#1C1C2E" text-anchor="middle" dominant-baseline="central"><tspan x="296" y="183" font-size="12">A máquina — deles</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11.5" fill="#1C1C2E" text-anchor="middle" font-weight="normal"><tspan x="200" y="224">Você paga mais e assume menos madrugada.</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11.5" fill="#1C1C2E" text-anchor="middle" font-weight="normal"><tspan x="200" y="250">Comece pela própria máquina: é onde se aprende.</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11.5" fill="#1C1C2E" text-anchor="middle" font-weight="bold"><tspan x="200" y="282">Migre o que já te acordou de madrugada.</tspan></text></svg>