<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img" aria-label="Um distribuidor na frente repassa os pedidos para duas cópias da aplicação, e o banco tem uma réplica que acompanha, de modo que nenhuma peça sozinha derrube o conjunto"><title>Um distribuidor na frente repassa os pedidos para duas cópias da aplicação, e o banco tem uma réplica que acompanha, de modo que nenhuma peça sozinha derrube o conjunto</title><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1C1C2E"/></marker></defs><rect x="140" y="14" width="120" height="40" rx="10" fill="#EEF1F5" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12.5" fill="#1C1C2E" text-anchor="middle" dominant-baseline="central"><tspan x="200" y="38" font-size="12.5">Quem acessa</tspan></text><line x1="200" y1="54" x2="200" y2="70" stroke="#1C1C2E" stroke-width="1.6" marker-end="url(#a)"/><rect x="120" y="72" width="160" height="42" rx="10" fill="#DCEBFA" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12.5" fill="#1C1C2E" text-anchor="middle" dominant-baseline="central"><tspan x="200" y="97" font-size="12.5">O distribuidor</tspan></text><line x1="160" y1="114" x2="100" y2="134" stroke="#1C1C2E" stroke-width="1.6" marker-end="url(#a)"/><line x1="240" y1="114" x2="300" y2="134" stroke="#1C1C2E" stroke-width="1.6" marker-end="url(#a)"/><rect x="30" y="136" width="140" height="44" rx="10" fill="#DDF3E7" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12.5" fill="#1C1C2E" text-anchor="middle" dominant-baseline="central"><tspan x="100" y="162" font-size="12.5">Cópia 1 do app</tspan></text><rect x="230" y="136" width="140" height="44" rx="10" fill="#DDF3E7" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12.5" fill="#1C1C2E" text-anchor="middle" dominant-baseline="central"><tspan x="300" y="162" font-size="12.5">Cópia 2 do app</tspan></text><line x1="100" y1="180" x2="160" y2="200" stroke="#1C1C2E" stroke-width="1.6" marker-end="url(#a)"/><line x1="300" y1="180" x2="240" y2="200" stroke="#1C1C2E" stroke-width="1.6" marker-end="url(#a)"/><rect x="120" y="202" width="160" height="40" rx="10" fill="#FDE7DF" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12.5" fill="#1C1C2E" text-anchor="middle" dominant-baseline="central"><tspan x="200" y="226" font-size="12.5">O banco</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11.5" fill="#1C1C2E" text-anchor="middle" font-weight="normal"><tspan x="200" y="264">Caiu a cópia 1? O distribuidor manda tudo para a 2.</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11.5" fill="#1C1C2E" text-anchor="middle" font-weight="bold"><tspan x="200" y="288">O banco ainda é peça única. Ele precisa de réplica também.</tspan></text></svg>