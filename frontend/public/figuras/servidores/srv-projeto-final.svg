<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img" aria-label="O conjunto completo de uma aplicação em produção: o nome que vira número, a portaria, o porteiro com o cadeado, a aplicação como serviço, o banco fechado e a cópia saindo para fora"><title>O conjunto completo de uma aplicação em produção: o nome que vira número, a portaria, o porteiro com o cadeado, a aplicação como serviço, o banco fechado e a cópia saindo para fora</title><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1C1C2E"/></marker></defs><rect x="14" y="14" width="110" height="38" rx="10" fill="#DCEBFA" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11.5" fill="#1C1C2E" text-anchor="middle" dominant-baseline="central"><tspan x="69" y="28.5" font-size="11.5">O nome</tspan><tspan x="69" y="45.5" font-size="11">vira número</tspan></text><line x1="124" y1="33" x2="144" y2="33" stroke="#1C1C2E" stroke-width="1.6" marker-end="url(#a)"/><rect x="146" y="14" width="100" height="38" rx="10" fill="#DCEBFA" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11.5" fill="#1C1C2E" text-anchor="middle" dominant-baseline="central"><tspan x="196" y="28.5" font-size="11.5">A portaria</tspan><tspan x="196" y="45.5" font-size="11">3 portas</tspan></text><line x1="246" y1="33" x2="266" y2="33" stroke="#1C1C2E" stroke-width="1.6" marker-end="url(#a)"/><rect x="268" y="14" width="118" height="38" rx="10" fill="#DDF3E7" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11.5" fill="#1C1C2E" text-anchor="middle" dominant-baseline="central"><tspan x="327" y="28.5" font-size="11.5">O porteiro</tspan><tspan x="327" y="45.5" font-size="11">com cadeado</tspan></text><line x1="327" y1="52" x2="327" y2="74" stroke="#1C1C2E" stroke-width="1.6" marker-end="url(#a)"/><rect x="240" y="76" width="146" height="40" rx="10" fill="#DDF3E7" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11.5" fill="#1C1C2E" text-anchor="middle" dominant-baseline="central"><tspan x="313" y="91.5" font-size="11.5">A aplicação</tspan><tspan x="313" y="108.5" font-size="11">como serviço</tspan></text><line x1="240" y1="96" x2="200" y2="96" stroke="#1C1C2E" stroke-width="1.6" marker-end="url(#a)"/><rect x="54" y="76" width="144" height="40" rx="10" fill="#FDE7DF" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11.5" fill="#1C1C2E" text-anchor="middle" dominant-baseline="central"><tspan x="126" y="91.5" font-size="11.5">O banco</tspan><tspan x="126" y="108.5" font-size="11">só por dentro</tspan></text><line x1="126" y1="116" x2="126" y2="140" stroke="#1C1C2E" stroke-width="1.6" marker-end="url(#a)"/><rect x="54" y="142" width="144" height="40" rx="10" fill="#EEF1F5" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11.5" fill="#1C1C2E" text-anchor="middle" dominant-baseline="central"><tspan x="126" y="157.5" font-size="11.5">A cópia</tspan><tspan x="126" y="174.5" font-size="11">sai da máquina</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11.5" fill="#1C1C2E" text-anchor="middle" font-weight="normal"><tspan x="200" y="216">Seis peças. Cada uma foi uma lição deste curso.</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11.5" fill="#1C1C2E" text-anchor="middle" font-weight="normal"><tspan x="200" y="246">Caiu alguma coisa? Percorra as seis na ordem</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11.5" fill="#1C1C2E" text-anchor="middle" font-weight="normal"><tspan x="200" y="262">e pare na primeira que não responder.</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11.5" fill="#1C1C2E" text-anchor="middle" font-weight="bold"><tspan x="200" y="290">É isso que separa administrar de chutar.</tspan></text></svg>