<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img" aria-label="Comparação entre procurar lendo todas as linhas de uma tabela e procurar por um atalho ordenado que leva direto à linha certa"><title>Comparação entre procurar lendo todas as linhas de uma tabela e procurar por um atalho ordenado que leva direto à linha certa</title><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1C1C2E"/></marker></defs><rect x="14" y="20" width="172" height="150" rx="10" fill="#FDE7DF" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" fill="#1C1C2E" text-anchor="middle" dominant-baseline="central"><tspan x="100" y="48" font-size="13">Sem atalho</tspan><tspan x="100" y="65" font-size="11"></tspan><tspan x="100" y="82" font-size="11">linha 1... não é</tspan><tspan x="100" y="99" font-size="11">linha 2... não é</tspan><tspan x="100" y="116" font-size="11">linha 3... não é</tspan><tspan x="100" y="133" font-size="11">...</tspan><tspan x="100" y="150" font-size="11">1 milhão de linhas</tspan></text><rect x="214" y="20" width="172" height="150" rx="10" fill="#DDF3E7" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" fill="#1C1C2E" text-anchor="middle" dominant-baseline="central"><tspan x="300" y="48" font-size="13">Com atalho</tspan><tspan x="300" y="65" font-size="11"></tspan><tspan x="300" y="82" font-size="11">olha a lista ordenada</tspan><tspan x="300" y="99" font-size="11">pula metade, e metade</tspan><tspan x="300" y="116" font-size="11">chega na linha certa</tspan><tspan x="300" y="133" font-size="11"></tspan><tspan x="300" y="150" font-size="11">cerca de 20 passos</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11.5" fill="#1C1C2E" text-anchor="middle" font-weight="normal"><tspan x="200" y="206">O atalho é uma cópia ordenada só da coluna procurada.</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11.5" fill="#1C1C2E" text-anchor="middle" font-weight="normal"><tspan x="200" y="232">Ele custa espaço e deixa a gravação um pouco mais lenta.</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11.5" fill="#1C1C2E" text-anchor="middle" font-weight="bold"><tspan x="200" y="270">Consulta lenta? Olhe o plano antes de trocar a máquina.</tspan></text></svg>