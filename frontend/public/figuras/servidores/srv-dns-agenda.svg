<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img" aria-label="Três passos em sequência: a pessoa digita um nome, um serviço de consulta devolve o endereço numérico correspondente e só então o navegador fala com a máquina certa"><title>Três passos em sequência: a pessoa digita um nome, um serviço de consulta devolve o endereço numérico correspondente e só então o navegador fala com a máquina certa</title><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1C1C2E"/></marker></defs><rect x="14" y="26" width="110" height="52" rx="10" fill="#DCEBFA" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" fill="#1C1C2E" text-anchor="middle" dominant-baseline="central"><tspan x="69" y="47.5" font-size="13">Você digita</tspan><tspan x="69" y="64.5" font-size="11">meusite.com.br</tspan></text><line x1="124" y1="52" x2="146" y2="52" stroke="#1C1C2E" stroke-width="1.6" marker-end="url(#a)"/><rect x="148" y="26" width="110" height="52" rx="10" fill="#EEF1F5" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" fill="#1C1C2E" text-anchor="middle" dominant-baseline="central"><tspan x="203" y="47.5" font-size="13">A consulta</tspan><tspan x="203" y="64.5" font-size="11">qual é o número?</tspan></text><line x1="258" y1="52" x2="280" y2="52" stroke="#1C1C2E" stroke-width="1.6" marker-end="url(#a)"/><rect x="282" y="26" width="104" height="52" rx="10" fill="#DDF3E7" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" fill="#1C1C2E" text-anchor="middle" dominant-baseline="central"><tspan x="334" y="47.5" font-size="13">A resposta</tspan><tspan x="334" y="64.5" font-size="11">203.0.113.10</tspan></text><line x1="334" y1="78" x2="334" y2="108" stroke="#1C1C2E" stroke-width="1.6" marker-end="url(#a)"/><rect x="240" y="110" width="146" height="46" rx="10" fill="#FDE7DF" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11.5" fill="#1C1C2E" text-anchor="middle" dominant-baseline="central"><tspan x="313" y="137" font-size="8.0">Agora sim: o navegador fala com a máquina</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11.5" fill="#1C1C2E" text-anchor="middle" font-weight="normal"><tspan x="200" y="188">É uma agenda gigante que troca nome por número.</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11.5" fill="#1C1C2E" text-anchor="middle" font-weight="normal"><tspan x="200" y="206">Computador não sabe abrir um nome. Ele só sabe números.</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11.5" fill="#1C1C2E" text-anchor="middle" font-weight="normal"><tspan x="200" y="242">A resposta fica guardada um tempo, e é por isso</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11.5" fill="#1C1C2E" text-anchor="middle" font-weight="normal"><tspan x="200" y="258">que trocar o endereço não vale para todo mundo na hora.</tspan></text></svg>