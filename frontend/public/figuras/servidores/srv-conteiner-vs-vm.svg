<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img" aria-label="Comparação entre máquinas virtuais, que carregam um sistema operacional inteiro cada uma, e contêineres, que dividem o mesmo sistema da máquina e carregam só o programa"><title>Comparação entre máquinas virtuais, que carregam um sistema operacional inteiro cada uma, e contêineres, que dividem o mesmo sistema da máquina e carregam só o programa</title><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1C1C2E"/></marker></defs><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12.5" fill="#1C1C2E" text-anchor="middle" font-weight="bold"><tspan x="104" y="20">Máquinas virtuais</tspan></text><rect x="14" y="30" width="180" height="40" rx="10" fill="#DCEBFA" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" fill="#1C1C2E" text-anchor="middle" dominant-baseline="central"><tspan x="104" y="45.5" font-size="12">App A</tspan><tspan x="104" y="62.5" font-size="11">App B</tspan></text><rect x="14" y="74" width="180" height="44" rx="10" fill="#FDE7DF" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" fill="#1C1C2E" text-anchor="middle" dominant-baseline="central"><tspan x="104" y="91.5" font-size="12">Um sistema inteiro</tspan><tspan x="104" y="108.5" font-size="11">para cada uma</tspan></text><rect x="14" y="122" width="180" height="34" rx="10" fill="#EEF1F5" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11.5" fill="#1C1C2E" text-anchor="middle" dominant-baseline="central"><tspan x="104" y="143" font-size="11.5">O repartidor de máquinas</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12.5" fill="#1C1C2E" text-anchor="middle" font-weight="bold"><tspan x="296" y="20">Contêineres</tspan></text><rect x="206" y="30" width="180" height="40" rx="10" fill="#DCEBFA" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" fill="#1C1C2E" text-anchor="middle" dominant-baseline="central"><tspan x="296" y="45.5" font-size="12">App A</tspan><tspan x="296" y="62.5" font-size="11">App B</tspan></text><rect x="206" y="74" width="180" height="44" rx="10" fill="#DDF3E7" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" fill="#1C1C2E" text-anchor="middle" dominant-baseline="central"><tspan x="296" y="91.5" font-size="12">Só o que o programa</tspan><tspan x="296" y="108.5" font-size="11">precisa junto</tspan></text><rect x="206" y="122" width="180" height="34" rx="10" fill="#EEF1F5" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11.5" fill="#1C1C2E" text-anchor="middle" dominant-baseline="central"><tspan x="296" y="143" font-size="11.5">O MESMO sistema da máquina</tspan></text><rect x="14" y="162" width="372" height="30" rx="10" fill="#EEF1F5" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" fill="#1C1C2E" text-anchor="middle" dominant-baseline="central"><tspan x="200" y="181" font-size="12">O computador de verdade</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11.5" fill="#1C1C2E" text-anchor="middle" font-weight="normal"><tspan x="200" y="222">O contêiner não carrega sistema. Ele usa o da máquina.</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11.5" fill="#1C1C2E" text-anchor="middle" font-weight="normal"><tspan x="200" y="240">Por isso sobe em segundos e ocupa megabytes, não gigas.</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11.5" fill="#1C1C2E" text-anchor="middle" font-weight="bold"><tspan x="200" y="276">Isolamento menor, em troca de leveza.</tspan></text></svg>