<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 210" width="360" height="210" role="img" aria-label="O Sol no centro e a Terra em dois pontos da órbita, sempre com o eixo inclinado para o mesmo lado. Em dezembro, o hemisfério sul está virado para o Sol; em junho, o hemisfério norte."><title>Estações do ano</title>
