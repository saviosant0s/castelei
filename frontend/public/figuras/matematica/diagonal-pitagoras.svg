<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="400" height="200" role="img" aria-label="Um triângulo com um canto reto. Um lado horizontal mede 3, um lado vertical mede 4, e a diagonal que liga as pontas mede 5."><title>Um triângulo com um canto reto. Um lado horizontal mede 3, um lado vertical mede 4, e a diagonal que liga as pontas mede 5.</title><path d="M 90 170 L 270 170 L 270 30 Z" fill="#DCEBFA" stroke="#1C1C2E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M 256 170 L 256 156 L 270 156" fill="none" stroke="#1C1C2E" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" font-weight="600" fill="#1C1C2E" text-anchor="middle"><tspan x="180" y="190">3 para o lado</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" font-weight="600" fill="#1C1C2E" text-anchor="start"><tspan x="284" y="104">4 para cima</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" font-weight="700" fill="#1C1C2E" text-anchor="end"><tspan x="160" y="92">5 em linha reta</tspan></text></svg>