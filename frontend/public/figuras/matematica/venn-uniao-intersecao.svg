<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 190" width="400" height="190" role="img" aria-label="Dois círculos que se sobrepõem, rotulados Futebol e Vôlei. A parte comum aos dois, no meio, está destacada e rotulada como os dois esportes."><title>Dois círculos que se sobrepõem, rotulados Futebol e Vôlei. A parte comum aos dois, no meio, está destacada e rotulada como os dois esportes.</title><defs><clipPath id="cA"><circle cx="160" cy="100" r="72"/></clipPath></defs><circle cx="160" cy="100" r="72" fill="#DCEBFA" stroke="#1C1C2E" stroke-width="1.6"/><circle cx="240" cy="100" r="72" fill="#DDF3E7" stroke="#1C1C2E" stroke-width="1.6"/><circle cx="240" cy="100" r="72" fill="#FDE7DF" clip-path="url(#cA)"/><circle cx="160" cy="100" r="72" fill="none" stroke="#1C1C2E" stroke-width="1.6"/><circle cx="240" cy="100" r="72" fill="none" stroke="#1C1C2E" stroke-width="1.6"/><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" font-weight="600" fill="#1C1C2E" text-anchor="middle"><tspan x="120" y="104">só futebol</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" font-weight="600" fill="#1C1C2E" text-anchor="middle"><tspan x="280" y="104">só vôlei</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" font-weight="700" fill="#1C1C2E" text-anchor="middle"><tspan x="200" y="98">os</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" font-weight="700" fill="#1C1C2E" text-anchor="middle"><tspan x="200" y="112">dois</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="700" fill="#1C1C2E" text-anchor="middle"><tspan x="120" y="20">Futebol</tspan></text><text font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="700" fill="#1C1C2E" text-anchor="middle"><tspan x="280" y="20">Vôlei</tspan></text></svg>