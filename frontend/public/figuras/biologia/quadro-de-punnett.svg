<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 270" width="400" height="270" role="img" aria-label="Quadro de dois por dois. Em cima, as letras A e a de um pai; à esquerda, A e a do outro. As casas mostram AA, Aa, Aa e aa. Três casas têm ervilha amarela e uma tem ervilha verde."><title>Quadro de cruzamento Aa com Aa</title>
<g font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" fill="#1C1C2E">
<text x="200" y="22" font-size="13" font-weight="600" text-anchor="middle" fill="#2F6FB0">letras de um pai</text>
<text x="40" y="150" font-size="13" font-weight="600" text-anchor="middle" fill="#2F6FB0" transform="rotate(-90 40 150)">letras do outro</text>
<text font-size="20" font-weight="700" text-anchor="middle"><tspan x="155" y="52">A</tspan><tspan x="265" y="52">a</tspan><tspan x="84" y="122">A</tspan><tspan x="84" y="222">a</tspan></text>
</g>
<rect x="100" y="65" width="110" height="95" fill="#FBF3D5" stroke="#1C1C2E" stroke-width="2.5"/>
<rect x="210" y="65" width="110" height="95" fill="#FBF3D5" stroke="#1C1C2E" stroke-width="2.5"/>
<rect x="100" y="160" width="110" height="95" fill="#FBF3D5" stroke="#1C1C2E" stroke-width="2.5"/>
<rect x="210" y="160" width="110" height="95" fill="#E3EFE0" stroke="#1C1C2E" stroke-width="2.5"/>
<circle cx="155" cy="128" r="13" fill="#F2C94C" stroke="#1C1C2E" stroke-width="2"/>
<circle cx="265" cy="128" r="13" fill="#F2C94C" stroke="#1C1C2E" stroke-width="2"/>
<circle cx="155" cy="223" r="13" fill="#F2C94C" stroke="#1C1C2E" stroke-width="2"/>
<circle cx="265" cy="223" r="13" fill="#6FB46F" stroke="#1C1C2E" stroke-width="2"/>
<g font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="20" font-weight="700" fill="#1C1C2E" text-anchor="middle">
<text x="155" y="100">AA</text><text x="265" y="100">Aa</text><text x="155" y="195">Aa</text><text x="265" y="195">aa</text>
</g>
</svg>
